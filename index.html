<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fretline"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><script>window.PWA_BUILD=true;if('serviceWorker' in navigator&&window.isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script><title>Fretline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Rosewood & pearl: the app dressed like the instrument. Rosewood fretboard for the room, pearl inlay for text,
   brass fret wire for rhythm work (Side A), abalone shell for lead (Side B). One family (Archivo) used at two
   widths: wide for names and headings, like a headstock decal; normal for everything you read. */
:root{
  --bg:#1a1310; --surface:#231a15; --surface-2:#2c211b; --surface-3:#382a22; --line:#3a2c24; --line-2:#523f33;
  --ink:#f3ebe0; --muted:#bcab99; --faint:#8b7a6a;
  --accent:#e7b65a; --accent-ink:#22160a; --accent-soft:#382a17;
  --lead:#66c9b5; --lead-ink:#0b2620; --lead-soft:#173129;
  --ok:#9bd47f; --ok-soft:#21301a; --warn:#e7b65a; --warn-soft:#382a17; --bad:#f2786c; --bad-soft:#3d1d19;
  --string:#a99d90; --fret:#c9bba8; --pearl:#efe6d8; --inlay:#efe6d8; --inlay-board:rgba(239,230,216,.16); --fretwire:rgba(201,187,168,.45); --vinyl:#0f0b09; --groove:rgba(255,255,255,.05); --led-off:#3f3028;
  --wood-grain:repeating-linear-gradient(92deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px, rgba(0,0,0,.05) 7px 8px, transparent 8px 15px);
  --shadow:0 1px 0 rgba(255,240,220,.035) inset,0 1px 2px rgba(0,0,0,.35),0 20px 44px -28px rgba(0,0,0,.85);
  --f-display:"Archivo", "Arial", system-ui, sans-serif;
  --f-body:"Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num:"Archivo", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --wide:118%;
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#ece0c8; --surface:#faf4e8; --surface-2:#f2e8d6; --surface-3:#e6d8bf; --line:#dfcfb3; --line-2:#c9b493;
    --ink:#2a1c13; --muted:#6b5645; --faint:#957f6a;
    --accent:#94640f; --accent-ink:#fff8ec; --accent-soft:#f1e1bf;
    --lead:#18766a; --lead-ink:#f2fffb; --lead-soft:#d5ece5;
    --ok:#3c7a2c; --ok-soft:#dfecd2; --warn:#94640f; --warn-soft:#f1e1bf; --bad:#b03a2e; --bad-soft:#f6ddd6;
    --string:#8f7f6d; --fret:#7c6a57; --pearl:#fffaf0; --inlay:#a08a72; --inlay-board:rgba(140,110,80,.18); --fretwire:rgba(124,106,87,.4); --vinyl:#2a1c13; --groove:rgba(255,255,255,.07); --led-off:#d9c9ad;
    --wood-grain:repeating-linear-gradient(92deg, rgba(120,80,30,.025) 0 2px, transparent 2px 9px, rgba(120,80,30,.03) 9px 10px, transparent 10px 17px);
    --shadow:0 1px 2px rgba(60,40,20,.07),0 18px 38px -26px rgba(60,40,20,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#ece0c8; --surface:#faf4e8; --surface-2:#f2e8d6; --surface-3:#e6d8bf; --line:#dfcfb3; --line-2:#c9b493;
  --ink:#2a1c13; --muted:#6b5645; --faint:#957f6a;
  --accent:#94640f; --accent-ink:#fff8ec; --accent-soft:#f1e1bf;
  --lead:#18766a; --lead-ink:#f2fffb; --lead-soft:#d5ece5;
  --ok:#3c7a2c; --ok-soft:#dfecd2; --warn:#94640f; --warn-soft:#f1e1bf; --bad:#b03a2e; --bad-soft:#f6ddd6;
  --string:#8f7f6d; --fret:#7c6a57; --pearl:#fffaf0; --inlay:#a08a72; --inlay-board:rgba(140,110,80,.18); --fretwire:rgba(124,106,87,.4); --vinyl:#2a1c13; --groove:rgba(255,255,255,.07); --led-off:#d9c9ad;
  --wood-grain:repeating-linear-gradient(92deg, rgba(120,80,30,.025) 0 2px, transparent 2px 9px, rgba(120,80,30,.03) 9px 10px, transparent 10px 17px);
  --shadow:0 1px 2px rgba(60,40,20,.07),0 18px 38px -26px rgba(60,40,20,.35);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;background-image:var(--wood-grain);background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:var(--wide);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.012em}
h4{font-size:16px;font-weight:700;letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:600 12.5px/1.3 var(--f-body);letter-spacing:.005em;color:var(--muted)}
code{font:500 12.5px var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}

/* LEDs */
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--led-off);flex:none;box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.led.ok{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb, var(--ok) 22%, transparent),0 0 10px color-mix(in srgb, var(--ok) 55%, transparent)}
.led.done{background:var(--ok);box-shadow:0 0 0 2px var(--surface-2),0 0 0 3.5px color-mix(in srgb, var(--ok) 70%, transparent)}
.led.warn{background:var(--accent);box-shadow:0 0 8px color-mix(in srgb, var(--accent) 45%, transparent)}
.led.low{background:color-mix(in srgb, var(--accent) 45%, var(--led-off))}
.led.off{background:var(--led-off)}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 2px rgba(255,77,77,.25)}

/* ---------- shell ---------- */
.app{max-width:1340px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:22px 72px;display:grid;grid-template-columns:256px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 18px);display:grid;gap:16px}
.brand{display:flex;gap:12px;align-items:center;padding:2px 4px}
.mark{width:40px;height:40px;flex:none}
.mark .mk-bg{fill:var(--surface);stroke:var(--line-2)}
.mark .mk-str line{stroke:var(--string);stroke-width:1.1}
.mark .mk-fret{stroke:var(--muted);stroke-width:2.2}
.mark .mk-dot{fill:var(--accent)}
.brand h1{font:800 26px/1 var(--f-display);font-stretch:125%;letter-spacing:-.02em}
.brand p{font-size:12.5px;color:var(--muted);margin-top:3px}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.today-n{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.today-n b{font:800 46px/1 var(--f-display);font-stretch:112%;letter-spacing:-.03em;grid-row:span 2}
.today-n span{font-size:13px;color:var(--muted);align-self:end}
.today-n em{font-style:normal;font-weight:700;font-size:14px;color:var(--accent);align-self:start}
.today-n.live em{color:var(--ok)}
.neck{width:100%;height:auto;display:block}
.neck .nk-board{fill:var(--surface-2);stroke:var(--line)}
.neck .nk-str{stroke:var(--string);opacity:.35}
.neck .nk-fret{stroke:var(--fret);stroke-width:1.4;opacity:.5}
.neck .nk-today{fill:none;stroke:var(--accent);stroke-width:1.2;opacity:.8}
.neck .nk-dot{fill:var(--inlay);opacity:.9}
.neck .nk-dot.full{fill:var(--accent);opacity:1}
.neck .nk-day{font:600 10px var(--f-body);fill:var(--faint)}
.neck .nk-day.on{fill:var(--ink)}
.rail .note b{color:var(--ink)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:1px solid transparent;background:none;border-radius:10px;cursor:pointer;font:600 15.5px/1.2 var(--f-body);color:var(--muted)}
.nav button .ix{display:none}
.nav button .ix{font:500 10.5px var(--f-num);color:var(--faint);width:20px}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav button[aria-current="page"] .ix{color:var(--accent)}
.nav .badge{margin-left:auto;font:500 11px var(--f-num);color:var(--muted);letter-spacing:0}
.sync{font:11px var(--f-num);color:var(--faint);padding:0 6px;display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--bad)}
.minitimer{display:none;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.minitimer.show{display:flex}
.minitimer b{font:600 16px var(--f-num);margin-left:auto;color:var(--accent)}

.main{display:grid;gap:22px;min-width:0}

/* ---------- common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;min-width:0;align-content:start}
.card.inner{background:var(--surface-2);border-color:var(--line);padding:14px 16px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.head .ht{display:grid;gap:8px;min-width:0;flex:1 1 420px}
.head h2{font-size:clamp(30px,4.4vw,46px);font-weight:600;letter-spacing:.01em}
.head p{color:var(--muted);max-width:68ch}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.sec-h h3{font-size:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 1px 1px rgba(0,0,0,.18)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.lead{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.btn.lead:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.rec .recdot{background:var(--accent-ink);box-shadow:none;opacity:.8}
.iconbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);cursor:pointer}
.iconbtn:hover{color:var(--ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-num);padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.ch{color:var(--ink);border-color:var(--line-2);background:var(--surface-2);font-weight:600}
.chip.ch.miss{color:var(--bad);border-color:var(--bad);background:none}
.chip.ch.none{color:var(--faint);border-style:dashed;background:none}
.chip.tempo i{font:italic 600 13px/1 var(--f-display);letter-spacing:.02em;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.ready{background:var(--accent-soft);color:var(--accent)}
.pill.build{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.lead{background:var(--lead-soft);color:var(--lead)}
.lvl{font:600 11.5px/1 var(--f-body);padding:4px 8px;border-radius:999px}
.lvl.l0{background:var(--surface-2);color:var(--muted)}
.lvl.l1{background:var(--warn-soft);color:var(--warn)}
.lvl.l2{background:var(--ok-soft);color:var(--ok)}
.meter{display:block;height:6px;border-radius:4px;background:var(--surface-3);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.meter.ok i{background:var(--ok)}
.field{display:grid;gap:5px;align-content:start}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field .seg{justify-self:start}
input[type=number],input[type=text],input[type=search],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input[type=number]{width:76px}
textarea{width:100%;resize:vertical}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 -2px 0 var(--accent)}
.empty{padding:22px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);text-align:center;display:grid;gap:8px;justify-items:center}
.note{font-size:13.5px;color:var(--muted)}
.kbd{font:500 11px var(--f-mono);padding:2px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--muted);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* chord diagram */
.chd{display:grid;justify-items:center;gap:2px}
.chd svg{display:block}
.chd .nm{font:700 17px var(--f-display);letter-spacing:.02em}
.chd svg .str{stroke:var(--string);stroke-width:1}
.chd svg .frt{stroke:var(--line-2);stroke-width:1}
.chd svg .nutl{stroke:var(--ink);stroke-width:4}
.chd svg .dot,.chd svg .barre{fill:var(--accent)}
.chd svg .fn{fill:var(--accent-ink);font:700 9px var(--f-num)}
.chd svg .mk{fill:none;stroke:var(--muted);stroke-width:1.4}
.chd svg .xm{stroke:var(--muted);stroke-width:1.4}
.chd svg .pos{fill:var(--muted);font:500 8px var(--f-num)}

/* ---------- today ---------- */
.hero{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);padding:28px 28px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:20px 32px;align-items:center;box-shadow:var(--shadow)}
.hero-t{display:grid;gap:14px;min-width:0}
.hero-score{min-width:0}
.hero-score{display:grid;gap:8px}
.strings{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:14px;row-gap:0;align-items:center}
.strings .fbbg{grid-column:2;grid-row:1 / span 3;align-self:stretch;margin:2px 0;border-radius:6px;background-color:var(--surface-2);border:1px solid var(--line);border-left:6px solid var(--pearl);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sline{display:contents}
.sline > *{grid-row:var(--r)}
.sline .tn{grid-column:1;font:600 13px var(--f-body);color:var(--muted);text-align:right;padding:15px 0}
.sline .sb{grid-column:2;position:relative;height:44px}
.sline .st,.sline .lit{position:absolute;left:0;top:50%;height:var(--w);translate:0 -50%;border-radius:2px}
.sline .st{right:0;background:var(--string);opacity:.6}
.sline .lit{background:var(--accent);box-shadow:0 0 6px color-mix(in srgb, var(--accent) 60%, transparent);height:calc(var(--w) + 1.5px)}
.sline .pos{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;translate:-50% -50%;background:var(--accent);border:2px solid var(--surface)}
.sline .tgt{position:absolute;top:22%;bottom:22%;width:2px;background:var(--accent);opacity:.45}
.sline.lead .lit{background:var(--lead);box-shadow:0 0 6px color-mix(in srgb, var(--lead) 60%, transparent)}
.sline.lead .pos{background:var(--lead)}
.sline.live .st,.sline.live .lit{animation:buzz .07s linear infinite alternate}
@keyframes buzz{from{translate:0 calc(-50% - .8px)}to{translate:0 calc(-50% + .8px)}}
.sline .tv{grid-column:3;font:700 16px var(--f-num);color:var(--ink);white-space:nowrap}
.sline .tv small{font-weight:500;font-size:13px;color:var(--faint)}
.sline.done .tv{color:var(--ok)}
.sline.live .tn{color:var(--ink)}
@media (prefers-reduced-motion: reduce){.sline.live .st,.sline.live .lit{animation:none}}
@media (max-width:1180px){.hero{grid-template-columns:1fr}.hero-score{max-width:620px}}
.hero > *{position:relative}
.hero h2{font-size:clamp(34px,4.6vw,54px);font-weight:800;font-stretch:112%;letter-spacing:-.025em}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero .lede{color:var(--muted);max-width:60ch}
.sessbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.sessbar .clock{font:600 32px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--accent)}
.sessbar .blk{font-size:13.5px;color:var(--muted)}
.setlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.setlist{grid-template-columns:1fr}}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;align-content:start;min-width:0;position:relative}
.slot.live{box-shadow:0 0 0 1px var(--accent),0 0 26px -10px var(--accent)}
.slot.lead-slot.live{box-shadow:0 0 0 1px var(--lead),0 0 26px -10px var(--lead)}
.slot .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot .num{font:500 11.5px var(--f-num);color:var(--muted);display:flex;gap:8px;align-items:baseline}
.slot .num b{font:800 18px var(--f-display);font-stretch:112%;color:var(--accent)}
.slot.lead-slot .num b{color:var(--lead)}
.slot .min{font:500 12px var(--f-num);color:var(--muted)}
.slot h3{font-size:27px}
.slot .big{font:800 40px/1 var(--f-display);font-stretch:112%;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
.slot .big .arrow{font-family:var(--f-body);font-weight:400;color:var(--accent);font-size:26px}
.slot .why{font-size:14px;color:var(--muted)}
.onboard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.onboard .n{font:700 24px var(--f-display);color:var(--accent)}
.onboard p{font-size:14.5px}
.nextup{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nextup .mvnum{font:700 44px/1 var(--f-display);color:var(--lead);width:64px;height:64px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--lead);letter-spacing:.02em}
.nextup .nb{display:grid;gap:4px;min-width:0}
.nextup h3{font-size:26px}
.nextup .nd .chd .nm{display:none}
@media (max-width:900px){.nextup{grid-template-columns:auto minmax(0,1fr)}.nextup .acts{grid-column:1 / -1}.nextup .nd{display:none}}
ul.recent{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recent li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;font-size:14.5px;align-items:baseline}

/* the desk */
.desk{gap:14px}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px 2px;padding:12px 8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;scrollbar-width:thin}
.chn{min-width:0;display:grid;justify-items:center;gap:7px;padding:8px 2px 6px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;color:var(--ink);text-align:center}
.chn:hover{background:var(--surface);border-color:var(--line-2)}
.chn .fader{position:relative;width:26px;height:92px;display:block}
.chn .slot-l{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);border-radius:2px;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.chn .fader::before{content:"";position:absolute;inset:4px 0;background:repeating-linear-gradient(180deg, var(--line-2) 0 1px, transparent 1px 11.5px);-webkit-mask:linear-gradient(90deg,#000 0 6px,transparent 6px 20px,#000 20px);mask:linear-gradient(90deg,#000 0 6px,transparent 6px 20px,#000 20px)}
.chn .fill{position:absolute;left:50%;bottom:0;width:4px;transform:translateX(-50%);border-radius:2px;background:var(--accent)}
.chn .cap{position:absolute;left:0;width:26px;height:14px;border-radius:3px;background:linear-gradient(180deg, var(--surface-3), var(--line-2));border:1px solid var(--line-2);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.chn .cap::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:2px;background:var(--ink);opacity:.75;border-radius:1px}
.chn .trk{font:600 11px var(--f-num);color:var(--accent)}
.chn .cn{font:600 13px/1.1 var(--f-display);letter-spacing:.02em;width:62px;height:2.2em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.chn .cv{font:500 10px var(--f-num);color:var(--muted);white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.legendrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legendrow span{display:inline-flex;gap:6px;align-items:center}

/* ---------- learn ---------- */
.score{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.score::before{content:"";position:absolute;left:0;right:0;top:34px;height:52px;background:repeating-linear-gradient(180deg, color-mix(in srgb, var(--string) 22%, transparent) 0 1px, transparent 1px 13px);pointer-events:none}
.mv{position:relative;display:grid;gap:6px;align-content:start;padding:16px 16px 14px;border:0;border-left:1px solid var(--line);background:none;cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.mv:first-child{border-left:0}
.mv:hover{background:color-mix(in srgb, var(--surface-2) 70%, transparent)}
.mv[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--accent)}
.mv .numeral{font:700 54px/1 var(--f-display);letter-spacing:.02em;color:var(--faint);position:relative;justify-self:start;padding:0 6px;background:var(--surface)}
.mv[aria-pressed="true"] .numeral,.mv:hover .numeral{background:var(--surface-2)}
.mv.current .numeral{color:var(--accent)}
.mv.done .numeral{color:var(--ok)}
.mv .mt{font:600 17px/1.1 var(--f-display);letter-spacing:.02em}
.mv .ms{font:500 12px var(--f-body);color:var(--muted)}
.mv.current .ms{color:var(--accent)} .mv.done .ms{color:var(--ok)}
.mv .meter{margin-top:4px}
.mvdetail{display:grid;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.mvhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.numeral.big{font:700 88px/.85 var(--f-display);color:var(--accent);min-width:70px}
.mvdetail.done .numeral.big{color:var(--ok)} .mvdetail.ahead .numeral.big{color:var(--faint)}
.mvhead h3{font-size:36px}
.mvhead p{max-width:70ch}
.gate{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;border:1px dashed var(--line-2);border-radius:14px;padding:14px 16px}
.gate > div{display:grid;gap:8px;flex:1 1 320px}
ul.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:center;font-size:14.5px}
.checks li span{flex:1;min-width:0}
.checks li b{font-size:13px;color:var(--muted)}
.checks li.ok b{color:var(--ok)}
.chordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px}
.chordcard{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;align-content:start}
.chordcard.full{border-color:color-mix(in srgb, var(--ok) 45%, var(--line))}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start}
.chordcard .chd{justify-items:start}
.chordcard .chd .nm{font-size:22px;padding-left:6px}
ul.steps{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px}
.steps li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.steps li.ok{color:var(--ink)}
.techgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.techcard{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--lead);border-radius:14px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.techcard.full{border-left-color:var(--ok)}
.songcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
ul.mvsongs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mvsongs li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.mvsongs .t{all:unset;cursor:pointer;font:600 18px var(--f-display);letter-spacing:.02em}
.mvsongs .t:hover{color:var(--accent);text-decoration:underline}
.mvsongs .t.lead:hover{color:var(--lead)}
.mvsongs .t:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- changes ---------- */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:18px;box-shadow:var(--shadow);min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.duo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:720px){.duo{grid-template-columns:1fr}}
.nowchord{display:flex;flex-wrap:wrap;gap:20px 44px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:20px 26px}
.nowchord .nm{font:700 clamp(72px,11vw,120px)/.9 var(--f-display);letter-spacing:.01em}
.nowchord .lbl{font:600 12.5px var(--f-body);color:var(--muted)}
.nowchord .chd .nm{display:none}
.nextchord{display:grid;gap:8px;justify-items:start;padding:16px;border:1px dashed var(--line-2);border-radius:16px}
.nextchord .nm{font:700 52px/1 var(--f-display);color:var(--muted)}
.beats{display:flex;gap:8px;flex-wrap:wrap}
.beats i{width:18px;height:18px;border-radius:50%;background:var(--led-off);border:2px solid var(--line-2);transition:background .05s}
.beats i.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px color-mix(in srgb, var(--accent) 60%, transparent)}
.beats i.chg{border-color:var(--accent)}
.beats i.cnt.on{background:var(--muted);border-color:var(--muted);box-shadow:none}
.strum{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:440px}
.strum span{display:grid;place-items:center;height:44px;border-radius:8px;background:var(--surface-2);font:700 18px var(--f-num);color:var(--muted);border:1px solid var(--line)}
.strum span.rest{color:var(--faint);font-weight:400}
.strum span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.strum-lab{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:440px;font:10px var(--f-num);color:var(--faint);text-align:center}
.bpmbox{display:flex;align-items:center;gap:10px}
.lcd{display:grid;justify-items:end;gap:2px;padding:6px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--line);min-width:118px;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.lcd .val{font:600 38px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 14px color-mix(in srgb, var(--accent) 35%, transparent)}
.lcd.lead .val{color:var(--lead);text-shadow:0 0 14px color-mix(in srgb, var(--lead) 35%, transparent)}
.lcd .unit{font:500 10.5px var(--f-num);color:var(--muted);letter-spacing:.04em}
.bpmbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font:600 18px var(--f-num)}
.bpmbtn:hover{border-color:var(--accent)}
.bigplay{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 6px var(--surface-2),0 8px 24px -10px var(--accent)}
.bigplay.lead{background:var(--lead);color:var(--lead-ink);box-shadow:0 0 0 6px var(--surface-2),0 8px 24px -10px var(--lead)}
.bigplay svg{width:30px;height:30px}
.bigplay.stop{background:var(--ink);color:var(--bg)}
.trainline{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.ratebox{font-size:14px;color:var(--muted)}
.ratebox b{color:var(--ink);font-family:var(--f-num)}
.tap{width:100%;min-height:240px;border-radius:22px;border:2px solid var(--line-2);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;gap:6px;padding:18px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tap:active{transform:scale(.995)}
.tap.run{border-color:var(--accent);box-shadow:0 0 30px -12px var(--accent)}
.tap .cnt{font:600 clamp(72px,12vw,120px)/1 var(--f-num);font-variant-numeric:tabular-nums}
.tap .sub{font-size:14.5px;color:var(--muted)}
.tap .pairnow{font:700 34px var(--f-display);display:flex;gap:12px;align-items:center}
.tap .pairnow .a{color:var(--accent)}
.pairgrid{display:flex;flex-wrap:wrap;gap:6px}
.pairgrid button{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 10px;cursor:pointer;font:600 13px var(--f-num);color:var(--ink);display:flex;gap:6px;align-items:center}
.pairgrid button small{font-weight:500;color:var(--muted)}
.pairgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pairgrid button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.75}
.histmini{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.histmini li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-block:5px}
.histmini li:last-child{border-bottom:0}

/* ---------- journey ---------- */
.lanes{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.lanes{grid-template-columns:1fr}}
.sidetag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 17px var(--f-display);margin-right:10px;vertical-align:2px;box-shadow:0 0 0 4px var(--vinyl)}
.sidetag.lead{background:var(--lead);color:var(--lead-ink)}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.path li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;position:relative}
.path li::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;background:var(--line)}
.path li:first-child::before{top:22px}
.path li:last-child::before{bottom:calc(100% - 22px)}
.path .node{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-num);background:var(--surface);border:2px solid var(--line-2);color:var(--muted);margin-top:4px}
.path .node.done{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.path .node.ready{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.path .node.cur{box-shadow:0 0 0 4px var(--accent-soft)}
.side-b .path .node.cur{box-shadow:0 0 0 4px var(--lead-soft)}
.path .node.goal{border-radius:10px;transform:rotate(45deg) scale(.88)}
.path .node.goal span{transform:rotate(-45deg)}
.path .node.lead-ready{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.path .body{padding:8px 0 18px;display:grid;gap:6px;min-width:0}
.path .body button.t{all:unset;cursor:pointer;font:600 20px var(--f-display);letter-spacing:.02em;display:inline}
.path .body button.t:hover{color:var(--accent);text-decoration:underline}
.side-b .path .body button.t:hover{color:var(--lead)}
.path .body button.t:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.path .sub{font-size:13.5px;color:var(--muted)}
.path .blk{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.path .blk b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.later{display:grid;gap:6px;border-top:1px dashed var(--line-2);padding-top:14px;font-size:14px;color:var(--muted)}
.later b{color:var(--ink);font-weight:600}
.later .btn{justify-self:start}

/* ---------- library ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters input[type=search]{flex:1 1 200px}
.songlist{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.1fr) 132px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:var(--ink)}
.srow:first-child{border-top:0}
.srow:hover{background:var(--surface-2)}
.srow .t{font:600 19px var(--f-display);letter-spacing:.02em}
.srow .a{font-size:13.5px;color:var(--muted)}
.srow .cs{display:flex;flex-wrap:wrap;gap:4px}
.srow .rd{display:grid;gap:5px;font:12px var(--f-num);color:var(--muted)}
.srow .st{justify-self:end}
.srow .kind{font:600 10px var(--f-num);color:var(--accent);display:flex;gap:8px;align-items:center}
.srow .kind.l{color:var(--lead)}
.trkno{display:inline-block;padding:2px 5px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);letter-spacing:.02em}
@media (max-width:820px){.srow{grid-template-columns:minmax(0,1fr) auto}.srow .cs,.srow .rd{grid-column:1 / -1}.srow .st{grid-row:1;grid-column:2}}
.verdict{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-weight:600}
.verdict.ok{background:var(--ok-soft)}
.capotable tr.dim td{opacity:.5}
.capotable tr.sel td{background:var(--surface-2)}
.capotable tr.best td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.capobtn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font:600 13px var(--f-num);white-space:nowrap}
.capobtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding-top:calc(env(safe-area-inset-top, 0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 40px);padding-left:22px;padding-right:max(22px, env(safe-area-inset-right, 0px));display:grid;gap:18px;align-content:start;box-shadow:-20px 0 60px -30px rgba(0,0,0,.6)}
.drawer .x{position:sticky;top:0;justify-self:end;margin-bottom:-36px;z-index:2}
.drawer h2{font-size:38px;padding-right:60px}
.prog{display:flex;flex-wrap:wrap;gap:4px}
.prog span{height:38px;display:grid;place-items:center;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font:700 16px var(--f-display);min-width:34px}
.diagrams{display:flex;flex-wrap:wrap;gap:12px 16px}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th{font:500 11px var(--f-num);color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ptable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ptable td.pr{font:600 14px var(--f-num);white-space:nowrap}
.statusseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.statusseg button{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 6px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.statusseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.statusseg button.fin[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.facts b{font:600 18px var(--f-num);font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted)}
.confirmbox{display:grid;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

/* ---------- lead ---------- */
.leadgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.riffpick{display:none}
@media (max-width:900px){.leadgrid{grid-template-columns:1fr}.leadgrid > .rifflist{display:none}.riffpick{display:flex}}
.rifflist{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.rifflist button{display:grid;gap:2px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.rifflist button:hover{background:var(--surface-2)}
.rifflist button[aria-current="true"]{background:var(--lead-soft);box-shadow:inset 3px 0 0 var(--lead)}
.rifflist button b{font:600 14.5px var(--f-body)}
.rifflist button span{font-size:12px;color:var(--muted)}
.rifflist .grp{font:600 12px var(--f-body);color:var(--faint);padding:10px 10px 4px}
.tabwrap{overflow-x:auto;background:var(--surface-2);border-radius:14px;padding:12px 6px;border:1px solid var(--line)}
.tabwrap svg{display:block}
.tabwrap .sl{stroke:var(--string);stroke-width:1;opacity:.7}
.tabwrap .bl{stroke:var(--muted);stroke-width:1.4}
.tabwrap .lab{fill:var(--muted);font:600 11px var(--f-mono)}
.tabwrap .fr{fill:var(--ink);font:600 13px var(--f-mono)}
.tabwrap .frbg{fill:var(--surface-2)}
.tabwrap .rest{fill:var(--faint);font:600 12px var(--f-mono)}
.tabwrap .dur{fill:var(--line-2)}
.tabwrap .tq{fill:var(--lead);font:600 10px var(--f-mono)}
.tabwrap .tq-arc{fill:none;stroke:var(--lead);stroke-width:1.2}
.tabwrap .tq-ln{stroke:var(--lead);stroke-width:1.6;stroke-linecap:round}
.tabwrap .col.on .frbg{fill:var(--lead)}
.tabwrap .col.on .fr{fill:var(--lead-ink)}
.tabwrap .col.on .dur{fill:var(--lead)}
.tabwrap .barn{fill:var(--faint);font:500 10px var(--f-mono)}
.editor textarea{font:14px/1.6 var(--f-mono);min-height:120px;background:var(--surface-2)}

const SFDET_SRC = "// Strum onset detector: streaming SuperFlux (B\u00f6ck & Widmer, 2013) confirmed by a pick-attack check.\n// Runs on 128-sample blocks. Shared by the AudioWorklet and the ScriptProcessor fallback.\nclass SFDet{\n  constructor(sr){\n    this.sr = sr; const N = this.N = 1024; this.H = 128;\n    this.buf = new Float32Array(N); this.re = new Float64Array(N); this.im = new Float64Array(N);\n    this.win = new Float64Array(N); for (let i = 0; i < N; i++) this.win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));\n    this.rev = new Uint16Array(N); for (let i = 0, b = Math.log2(N); i < N; i++){ let r = 0; for (let k = 0; k < b; k++) r |= ((i >> k) & 1) << (b - 1 - k); this.rev[i] = r; }\n    this.cs = new Float64Array(N / 2); this.sn = new Float64Array(N / 2); for (let i = 0; i < N / 2; i++){ this.cs[i] = Math.cos(-2 * Math.PI * i / N); this.sn[i] = Math.sin(-2 * Math.PI * i / N); }\n    // log-spaced triangular bands, 12 per octave, 60 Hz \u2013 8 kHz\n    const fmin = 60, fmax = 8000, per = 12, ne = Math.floor(Math.log2(fmax / fmin) * per) + 2, edges = [];\n    for (let i = 0; i < ne; i++) edges.push(fmin * Math.pow(2, i / per));\n    this.bands = [];\n    for (let i = 0; i + 2 < edges.length; i++){\n      const l = edges[i], c = edges[i + 1], r = edges[i + 2], w = [], idx = [];\n      for (let k = 0; k <= N / 2; k++){ const f = k * sr / N; const v = Math.min((f - l) / (c - l), (r - f) / (r - c)); if (v > 0){ idx.push(k); w.push(v); } }\n      if (w.length) this.bands.push({k0: idx[0], w: Float64Array.from(w)});\n    }\n    const B = this.nb = this.bands.length; this.S = [new Float64Array(B), new Float64Array(B), new Float64Array(B)]; this.si = 0; this.nS = 0;\n    this.D = new Float64Array(64); this.T = new Float64Array(64); this.nD = 0; this.level = 1e-3;\n    this.a = 1 / (1 + 2 * Math.PI * 1200 / sr); this.px = 0; this.py = 0;\n    this.E = new Float64Array(64); this.ET = new Float64Array(64); this.nE = 0; // pick-attack energy per block\n    this.pend = []; this.last = -1; this.hpPend = []; this.hpLast = -1; this.recent = []; this.setSens(7);\n  }\n  setSens(s){ s = Math.max(1, Math.min(10, s)); this.delta = 0.25 + (7 - s) * 0.02; this.rmin = 1.8 - (s - 7) * 0.13; this.floor = Math.pow(10, -3.5 - s * 0.3); const s2 = Math.max(1, s - 1); this.hpTh = 5.7 - 0.45 * s2; this.hpFloor = Math.pow(10, -3.5 - s2 * 0.3); }\n  fft(){\n    const N = this.N, re = this.re, im = this.im, rev = this.rev;\n    for (let i = 0; i < N; i++){ const j = rev[i]; if (j > i){ let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }\n    for (let size = 2; size <= N; size <<= 1){\n      const half = size >> 1, step = N / size;\n      for (let s = 0; s < N; s += size) for (let k = 0; k < half; k++){\n        const c = this.cs[k * step], sn = this.sn[k * step], a = s + k, b = a + half;\n        const tr = re[b] * c - im[b] * sn, ti = re[b] * sn + im[b] * c;\n        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;\n      }\n    }\n  }\n  // block: 128 samples; tEnd: time (s) just after the block's last sample. Returns [{t, e}] confirmed onsets.\n  feed(block, tEnd){\n    const N = this.N, H = this.H, buf = this.buf;\n    buf.copyWithin(0, H); buf.set(block, N - H);\n    // pick-attack energy (1.2 kHz high-pass)\n    let e = 0; const a = this.a;\n    for (let i = 0; i < H; i++){ const x = block[i]; const y = a * (this.py + x - this.px); this.px = x; this.py = y; e += y * y; }\n    e /= H;\n    // second opinion: a sharp jump in pick-attack energy (catches light up strums into ringing chords)\n    if (this.nE >= 12){\n      let ref = 0; for (let m = this.nE - 10; m < this.nE - 2; m++) ref += this.E[m % 64]; ref = ref / 8 + 1e-12;\n      const tb = tEnd - H / this.sr;\n      if (e > this.hpTh * ref && e > this.hpFloor && tb - this.hpLast > 0.07){ this.hpLast = tb; this.hpPend.push({t: tb - 0.009, e: e}); }\n    }\n    const eslot = this.nE % 64; this.E[eslot] = e; this.ET[eslot] = tEnd - H / this.sr; this.nE++;\n    // spectrum \u2192 log bands\n    for (let i = 0; i < N; i++){ this.re[i] = buf[i] * this.win[i]; this.im[i] = 0; }\n    this.fft();\n    const S = this.S[this.si % 3];\n    for (let b = 0; b < this.nb; b++){\n      const bd = this.bands[b]; let s = 0;\n      for (let j = 0; j < bd.w.length; j++){ const k = bd.k0 + j; s += bd.w[j] * Math.sqrt(this.re[k] * this.re[k] + this.im[k] * this.im[k]); }\n      S[b] = Math.log10(1 + 20 * s);\n    }\n    this.si++; this.nS++;\n    let d = 0;\n    if (this.nS >= 3){\n      const ref = this.S[this.si % 3]; // two frames back\n      for (let b = 0; b < this.nb; b++){\n        let r = ref[b]; if (b > 0 && ref[b - 1] > r) r = ref[b - 1]; if (b + 1 < this.nb && ref[b + 1] > r) r = ref[b + 1];\n        const v = S[b] - r; if (v > 0) d += v;\n      }\n    }\n    const di = this.nD % 64; this.D[di] = d; this.T[di] = tEnd - N / 2 / this.sr; this.nD++;\n    this.level = Math.max(d, this.level * 0.9985);\n    const W = 3, D = this.D, n = this.nD, at = k => D[((k % 64) + 64) % 64];\n    if (n > 41){\n      const i = n - 1 - W, v = at(i); let isMax = true;\n      for (let k = i - W; k <= i + W; k++) if (at(k) > v){ isMax = false; break; }\n      let avg = 0; for (let k = i - 37; k < i; k++) avg += at(k); avg /= 37;\n      if (isMax && v > 0 && (v - avg) / this.level >= this.delta && v / this.level > 0.08){\n        let j = i; while (j > i - 12 && at(j - 1) > 0.15 * v && at(j - 1) <= at(j)) j--;\n        const t = this.T[((j % 64) + 64) % 64];\n        if (t - this.last >= 0.07){ this.last = t; this.pend.push({t, raw: v}); }\n      }\n    }\n    // confirm candidates once 8 blocks of attack energy after them are in\n    const out = [];\n    while (this.pend.length && tEnd >= this.pend[0].t + 9 * H / this.sr){\n      const c = this.pend.shift(); let best = 0, peak = 0;\n      for (let k = this.nE - 1; k >= Math.max(10, this.nE - 60); k--){\n        const ti = this.ET[k % 64]; if (ti < c.t - 2 * H / this.sr - 1e-6) break;\n        if (ti > c.t + 8 * H / this.sr) continue;\n        let ref = 0; for (let m = k - 10; m < k - 2; m++) ref += this.E[((m % 64) + 64) % 64]; ref = ref / 8 + 1e-12;\n        const r = this.E[k % 64] / ref; if (r > best) best = r; if (this.E[k % 64] > peak) peak = this.E[k % 64];\n      }\n      if (best >= this.rmin && peak > this.floor){ out.push({t: c.t, e: c.raw, r: best}); this.recent.push(c.t); }\n    }\n    while (this.hpPend.length && tEnd >= this.hpPend[0].t + 0.08){\n      const h = this.hpPend.shift();\n      if (!this.recent.some(t => Math.abs(t - h.t) < 0.05)){ out.push({t: h.t, e: 0, r: 0, hp: true}); this.recent.push(h.t); }\n    }\n    if (this.recent.length > 16) this.recent.splice(0, this.recent.length - 16);\n    out.sort((a, b) => a.t - b.t);\n    return out;\n  }\n}\n\n";

/* =========================================================
   Helpers
   ========================================================= */
const CH_ORDER = CHORD_LIST;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const dk = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmtClock = s => { s = Math.max(0, Math.round(s)); return pad2(Math.floor(s/60)) + ':' + pad2(s%60); };
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDay = key => { const [y,m,d] = key.split('-').map(Number); const dt = new Date(y, m-1, d); return DAYS[dt.getDay()] + ' ' + d + ' ' + MONTHS[m-1]; };
const chIdx = c => { const i = CHORD_LIST.indexOf(c); return i < 0 ? 999 : i; };
const pk = (a, b) => chIdx(a) <= chIdx(b) ? a + '-' + b : b + '-' + a;
const pairChords = k => k.split('-');
const pairLabel = k => { const [a,b] = pairChords(k); return a + ' ↔ ' + b; };
function tempoName(bpm){ return bpm < 60 ? 'Largo' : bpm < 76 ? 'Adagio' : bpm < 108 ? 'Andante' : bpm < 120 ? 'Moderato' : bpm < 168 ? 'Allegro' : 'Presto'; }
const tempoChip = bpm => `<span class="chip tempo" title="${bpm} beats per minute"><i>${tempoName(bpm)}</i> ${bpm}</span>`;

/* =========================================================
   Storage: localStorage mirror + artifact db (source of truth when available)
   ========================================================= */
const LS_KEY = 'fretline:v1';
const SECTIONS = ['drills','tempos','songs','sessions','riffs','settings','learn','mysongs','strum'];
function defaults(){
  return {
    drills:{items:[]},      // {d, t, p, n}
    tempos:{items:[]},      // {d, t, p, bpm, beats}
    songs:{map:{}},         // id -> {status, note, confirmedAt}
    sessions:{days:{}, dev:{}}, // days: minutes from the old timer; dev: device -> dateKey -> seconds per track {c,s,l}
    riffs:{map:{}},         // id -> {title, text, bpm, ts, custom}
    settings:{known:[...START_CHORDS], lo:15, hi:30, blocks:[10,10,10], sound:'acoustic', name:'Sahil'},
    learn:{tech:{}, opened:{}}, // tech id -> {at}; movement id -> timestamp when started early
    mysongs:{items:[]},     // custom strumming songs from the capo finder
    strum:{runs:[], sync:{}, cfg:{latency:null, sens:7, mix:{click:0.6, drums:0.7, bass:0.6, guide:0.35}}}, // strum coach
  };
}
const store = { data: defaults(), db:null, timers:{}, writing:{}, again:{}, status:'local' };
function mergeSection(name, obj){
  const base = defaults()[name];
  if (!obj || typeof obj !== 'object') return base;
  const out = Object.assign(base, JSON.parse(JSON.stringify(obj)));
  if (name === 'settings'){
    if (!Array.isArray(out.known)) out.known = [...START_CHORDS];
    out.known = out.known.filter(c => SHAPES[c]);
    if (!Array.isArray(out.blocks) || out.blocks.length !== 3) out.blocks = [10,10,10];
  }
  if (name === 'learn'){ if (!out.tech || typeof out.tech !== 'object') out.tech = {}; if (!out.opened || typeof out.opened !== 'object') out.opened = {}; }
  if (name === 'mysongs' && !Array.isArray(out.items)) out.items = [];
  if (name === 'sessions'){ if (!out.days || typeof out.days !== 'object') out.days = {}; if (!out.dev || typeof out.dev !== 'object') out.dev = {}; }
  if (name === 'strum'){
    if (!Array.isArray(out.runs)) out.runs = [];
    if (!out.sync || typeof out.sync !== 'object') out.sync = {};
    const dc = defaults().strum.cfg; out.cfg = Object.assign({}, dc, out.cfg || {}); out.cfg.mix = Object.assign({}, dc.mix, (out.cfg && out.cfg.mix) || {});
  }
  return out;
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    for (const s of SECTIONS) if (o && o[s]) store.data[s] = mergeSection(s, o[s]);
  }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store.data)); }catch(e){} }
let DV = 0; // data version: bumps on every change so derived numbers can be cached
const memo = {};
function cached(key, fn){ const m = memo[key]; if (m && m.v === DV) return m.val; const val = fn(); memo[key] = {v:DV, val}; return val; }
function touch(section){
  DV++;
  saveLocal();
  if (!store.db) return;
  clearTimeout(store.timers[section]);
  store.timers[section] = setTimeout(() => flush(section), 600);
}
async function flush(section){
  if (!store.db) return;
  if (store.writing[section]){ store.again[section] = true; return; }
  store.writing[section] = true;
  try{
    await store.ref(section).set(JSON.parse(JSON.stringify(store.data[section])));
    setSync('on');
  }catch(e){
    setSync('err', e && e.code === 'quota_exceeded' ? 'Storage is full' : 'Could not sync; saved on this device');
  }finally{
    store.writing[section] = false;
    if (store.again[section]){ store.again[section] = false; flush(section); }
  }
}
function setSync(state, msg){
  store.status = state;
  const el = $('#sync'); if (!el) return;
  el.className = 'sync' + (state === 'on' ? ' on' : state === 'err' ? ' err' : '');
  el.querySelector('span').textContent = msg || (state === 'on' ? 'Synced to your account' : 'Saved on this device');
}
function isDefaultSection(name){
  const d = store.data[name];
  if (name === 'drills' || name === 'tempos' || name === 'mysongs') return !d.items.length;
  if (name === 'songs' || name === 'riffs') return !Object.keys(d.map).length;
  if (name === 'sessions') return !Object.keys(d.days).length && !Object.keys(d.dev || {}).length;
  if (name === 'learn') return !Object.keys(d.tech).length && !Object.keys(d.opened).length;
  if (name === 'strum') return !d.runs.length && !Object.keys(d.sync).length && d.cfg.latency == null && JSON.stringify(d.cfg) === JSON.stringify(defaults().strum.cfg);
  return JSON.stringify(d) === JSON.stringify(defaults().settings);
}
function mergeRemoteLocal(name, remote, local){
  // Saved data wins, but anything recorded only on this device is kept.
  if (name === 'drills' || name === 'tempos'){
    const seen = new Set(remote.items.map(x => x.t + ':' + x.p));
    const extra = local.items.filter(x => !seen.has(x.t + ':' + x.p));
    return {items: remote.items.concat(extra).sort((a, b) => a.t - b.t)};
  }
  if (name === 'mysongs'){
    const seen = new Set(remote.items.map(x => x.id));
    return {items: remote.items.concat(local.items.filter(x => !seen.has(x.id)))};
  }
  if (name === 'sessions'){
    const days = Object.assign({}, remote.days);
    for (const [k, v] of Object.entries(local.days)) days[k] = Math.max(days[k] || 0, v);
    // practice seconds are kept per device, so two devices add up; the same device's bucket only grows
    const dev = JSON.parse(JSON.stringify(remote.dev || {}));
    for (const [d, byDay] of Object.entries(local.dev || {})){ dev[d] = dev[d] || {}; for (const [k, x] of Object.entries(byDay)){ const r = dev[d][k] || {}; dev[d][k] = {c: Math.max(r.c || 0, x.c || 0), s: Math.max(r.s || 0, x.s || 0), l: Math.max(r.l || 0, x.l || 0)}; } }
    return {days, dev};
  }
  if (name === 'songs' || name === 'riffs'){
    const map = Object.assign({}, remote.map);
    for (const [k, v] of Object.entries(local.map)) if (!map[k]) map[k] = v;
    return {map};
  }
  if (name === 'strum'){
    const seen = new Set(remote.runs.map(r => r.t));
    return {runs: remote.runs.concat(local.runs.filter(r => !seen.has(r.t))).sort((a, b) => a.t - b.t), sync: Object.assign({}, local.sync, remote.sync), cfg: remote.cfg.latency == null && local.cfg.latency != null ? local.cfg : remote.cfg};
  }
  if (name === 'learn'){
    return {tech: Object.assign({}, local.tech, remote.tech), opened: Object.assign({}, local.opened, remote.opened)};
  }
  return remote;
}
async function connectDb(){
  let tries = 0;
  while (!(window.claude && typeof window.claude.use === 'function') && tries < 20){ await new Promise(r => setTimeout(r, 150)); tries++; }
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  let db = null;
  try{ db = await window.claude.use('db'); }catch(e){ db = null; }
  if (!db) return;
  try{
    // Each person's progress lives in their own private space, so the page can be shared without mixing anyone's data.
    let uid = null, owner = true;
    try{ const user = await window.claude.use('user'); if (user){ uid = await user.id(); owner = await user.isOwner(); } }catch(e){}
    store.owner = owner;
    store.ref = s => uid ? db.doc('data/users/' + uid + '/fretline-' + s) : db.doc('fretline/' + s);
    let snaps = await Promise.all(SECTIONS.map(s => store.ref(s).get()));
    // the owner's progress from before it moved into their private space
    const moved = new Set();
    if (uid && owner) snaps = await Promise.all(snaps.map(async (snap, i) => { if (snap.exists) return snap; try{ const old = await db.doc('fretline/' + SECTIONS[i]).get(); if (old.exists){ moved.add(SECTIONS[i]); return old; } return snap; }catch(e){ return snap; } }));
    if (!owner && !snaps[SECTIONS.indexOf('settings')].exists && store.data.settings.name === 'Sahil') store.data.settings.name = '';
    store.db = db;
    snaps.forEach((snap, i) => {
      const s = SECTIONS[i];
      if (!snap.exists){ if (!isDefaultSection(s)) flush(s); return; }
      const remote = mergeSection(s, snap.data());
      const merged = mergeRemoteLocal(s, remote, store.data[s]);
      store.data[s] = merged;
      if (moved.has(s) || JSON.stringify(merged) !== JSON.stringify(remote)) flush(s);
    });
    DV++;
    saveLocal();
    setSync('on');
    render();
  }catch(e){

function addDrill(p, n){ store.data.drills.items.push({d:dk(), t:Date.now(), p, n}); touch('drills'); }

/* =========================================================
   Songs: built-in + your own
   ========================================================= */
function allSongs(){ return SONGS.concat(store.data.mysongs.items.map(s => Object.assign({mv:0, custom:true, genre:'My songs', artist:'', ts:4, strum:'D – D U – U D U', tip:'', tempoNote:''}, s))); }

/* =========================================================
   Readiness model
   ========================================================= */
function songNeeds(song){
  const m = {}; const s = song.seq;
  for (let i = 0; i < s.length; i++){
    const [a, beats] = s[i]; const [b] = s[(i+1) % s.length];
    if (a === b) continue;
    const k = pk(a, b); const rate = song.bpm / beats;

}
function songChords(song){ return [...new Set(song.seq.map(x => x[0]))]; }

  for (const d0 of store.data.drills.items){
    const d = d0.p === norm(d0.p) ? d0 : Object.assign({}, d0, {p: norm(d0.p)});
    best[d.p] = Math.max(best[d.p] || 0, d.n);
    (hist[d.p] = hist[d.p] || []).push(d);
    count[d.p] = (count[d.p] || 0) + 1;

  const chordBest = c => { let v = 0, k = null; for (const p of new Set([...Object.keys(best), ...Object.keys(clean)])){ if (pairChords(p).includes(c) && have(p) > v){ v = have(p); k = p; } } return {v, k}; };

  const pairs = Object.entries(needs).map(([k, need]) => {
    const have = st.have(k);

// Every strumming song in one stable order: by movement, then by how fast the changes come; the goal song last.
function strumOrderAll(){
  const st = computeStats();

    .sort((a, b) => (a.s.goal ? 1 : 0) - (b.s.goal ? 1 : 0) || (a.s.custom ? 1 : 0) - (b.s.custom ? 1 : 0) || (a.s.mv || 0) - (b.s.mv || 0) || a.r.maxNeed - b.r.maxNeed);
}
function trackNo(id){ const i = strumOrderAll().findIndex(x => x.s.id === id); return 'A' + (i + 1); }
function leadOrderAll(){ return LEAD.map((l, i) => ({l, i, mv: leadMv(l)})).sort((a, b) => (a.l.goal ? 1 : 0) - (b.l.goal ? 1 : 0) || a.mv - b.mv || a.i - b.i).map(x => x.l); }

function songInPlay(s){ return s.custom || s.goal || mvOpen(s.mv || 1); }

// Songs on your path right now (movements you've started), in order.
function strumOrder(){ return strumOrderAll().filter(x => songInPlay(x.s)); }

const PARTNER = {Cadd9:'G', Em7:'G', Dsus2:'D', Dsus4:'D', Asus2:'A', Asus4:'A', A7sus4:'Em7', Fmaj7:'C', F:'C', E5:'A5', A5:'E5', Am7:'C', A7:'D7', D7:'A7', E7:'A7', G7:'C', C7:'F', B7:'Em', Bm:'D', 'F#m':'D'};
function allPairs(){

    const [a, b] = pairChords(k);
    if (!knows(a) || !knows(b)) return;

    if (fromSong){ set[k].songs++; set[k].minNeed = Math.min(set[k].minNeed, need); }
  };
  for (const s of allSongs()) if (songInPlay(s)) for (const [k, need] of Object.entries(songNeeds(s))) add(k, need, true);
  for (const c of settings().known) if (!START_CHORDS.includes(c) && PARTNER[c]) add(pk(c, PARTNER[c]), 20, false);

/* =========================================================
   Learning path: movements
   ========================================================= */
const CHORD_TARGET = 20; // changes a minute with a new chord before it counts as learned
function chordSteps(c, st){
  st = st || computeStats();
  const cb = st.chordBest(c);
  const songs = allSongs().filter(s => songChords(s).includes(c));
  const doneSong = songs.find(s => songState(s.id).status === 'done');
  return {shape: knows(c), changes: cb.v >= CHORD_TARGET, best: cb.v, bestPair: cb.k, song: !!doneSong, doneSong, songs,
    partner: PARTNER[c] || null};
}
function mvSongs(m){ return SONGS.filter(s => (s.mv || 1) === m.n); }
function mvLead(m){ return LEAD.filter(l => leadMv(l) === m.n); }
// Each movement's exit check, built from your own numbers.
function mvChecks(m, st){
  st = st || computeStats();

  if (m.n === 1){
    const fast = Object.keys(Object.assign({}, st.best, st.clean)).filter(k => st.have(k) >= s.hi).length;
    const sd = mvSongs(m).filter(x => done(x.id)).length;
    const ld = LEAD.filter(l => leadMv(l) === 1 && done(l.id)).length;
    return [
      {label:`4 chord pairs at ${s.hi}+ changes a minute`, have:Math.min(fast, 4), need:4},
      {label:'2 strumming songs played with the track', have:Math.min(sd, 2), need:2},
      {label:'2 lead riffs played with the track', have:Math.min(ld, 2), need:2},
    ];
  }
  const chordsOk = m.chords.filter(c => { const x = chordSteps(c, st); return x.shape && x.changes; }).length;
  const techs = m.techs.filter(t => TECHS[t].drill);
  const techOk = techs.filter(techLearned).length;
  const songDone = mvSongs(m).some(x => done(x.id)) || mvLead(m).some(l => done(l.id));
  return [
    {label:`Every new chord learned and changing at ${CHORD_TARGET}+ a minute`, have:chordsOk, need:m.chords.length},
    {label:`${techs.map(t => TECHS[t].name).join(', ')}: drill${techs.length > 1 ? 's' : ''} played cleanly`, have:techOk, need:techs.length},
    {label:'One song from this movement played with the track', have:songDone ? 1 : 0, need:1},
  ];
}
function mvComplete(m, st){ return mvChecks(m, st).every(c => c.have >= c.need); }
MOVEMENTS.forEach((m, i) => m.n = i + 1);
function mvOpen(n){ return cached('open' + n, () => mvOpenRaw(n)); }
function mvOpenRaw(n){
  if (n <= 1) return true;
  const m = MOVEMENTS[n - 1]; if (!m) return false;
  if (store.data.learn.opened[m.id]) return true;
  return mvComplete(MOVEMENTS[n - 2]) && mvOpen(n - 1);
}
function mvState(m, st){ return mvComplete(m, st) && mvOpen(m.n) ? 'done' : mvOpen(m.n) ? 'current' : 'ahead'; }
function currentMv(){ const st = computeStats(); return MOVEMENTS.find(m => mvState(m, st) === 'current') || MOVEMENTS[MOVEMENTS.length - 1]; }
// The next new thing to learn: a chord shape or a technique in the movement you're on.
function nextNew(){
  const st = computeStats();
  for (const m of MOVEMENTS){
    if (!mvOpen(m.n)) break;
    for (const c of m.chords){ const x = chordSteps(c, st); if (!x.shape) return {m, kind:'chord', c, step:'shape'}; if (!x.changes) return {m, kind:'chord', c, step:'changes', x}; }
    for (const t of m.techs) if (TECHS[t].drill && !techLearned(t)) return {m, kind:'tech', t};
  }
  return null;
}
function todayPlan(){
  const order = strumOrder();
  const notDone = order.filter(x => songState(x.s.id).status !== 'done');
  const playable = notDone.filter(x => !x.r.missing.length);
  const target = playable.find(x => !x.r.ready) || playable[0] || notDone[0] || order[order.length-1];
  const playNow = playable.find(x => x.r.ready) || target;
  let drillPair = null, drillFor = null;
  for (const x of playable){ if (x.r.blockers.length){ drillPair = x.r.blockers[0]; drillFor = x.s; break; } }
  if (!drillPair){ const p = allPairs()[0]; drillPair = {k: p ? p.k : 'D-G', need: p ? p.minNeed : 20, have: computeStats().have(p ? p.k : 'D-G')}; drillFor = null; }
  const path = leadPath();
  const lead = path.find(l => songState(l.id).status !== 'done') || path[0] || LEAD[0];
  return {order, target, playNow, drillPair, drillFor, lead, next: nextNew()};
}

/* =========================================================
   Capo finder
   ========================================================= */
const NOTE_IX = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

const QUAL = {'':'', 'maj':'', 'M':'', 'm':'m', 'min':'m', '-':'m', '7':'7', 'dom7':'7', 'm7':'m7', 'min7':'m7', 'maj7':'maj7', 'M7':'maj7', 'sus2':'sus2', 'sus4':'sus4', 'sus':'sus4', 'add9':'add9', '2':'sus2', '5':'5', '7sus4':'7sus4', '7sus':'7sus4', '6':'', 'm6':'m', '9':'7', 'm9':'m7', 'maj9':'maj7', 'dim':null, 'aug':null};
const SIMPLER = {maj7:'', add9:'', sus2:'', sus4:'', '7sus4':'7', m7:'m', '7':'', '5':''};
function parseChordName(tok){
  const m = /^([A-G])(#|b)?([a-zA-Z0-9#\-]*?)(?:\/([A-G](?:#|b)?))?$/.exec(tok.trim());
  if (!m) return null;
  const q = m[3] || '';
  if (!(q in QUAL)) return null;
  return {root: NOTE_IX[m[1] + (m[2] || '')], q: QUAL[q], text: tok.trim()};
}
function parseSheet(text){
  const chords = [], bad = [];
  for (const tok of String(text || '').split(/[\s,|\-–—>]+/).filter(Boolean)){
    if (/^[x×]\d+$/i.test(tok) || /^\d+$/.test(tok)) continue;
    const c = parseChordName(tok);
    if (c && c.q !== null) chords.push(c); else bad.push(tok);
  }
  return {chords, bad};
}
function shapeFor(root, q){
  const name = SHARP[((root % 12) + 12) % 12] + q;
  if (SHAPES[name]) return {name, simplified:false};
  if (q in SIMPLER){ const n2 = SHARP[((root % 12) + 12) % 12] + SIMPLER[q]; if (SHAPES[n2]) return {name:n2, simplified:true}; const n3 = SHARP[((root % 12) + 12) % 12] + (q.startsWith('m') && q !== 'maj7' ? 'm' : ''); if (SHAPES[n3]) return {name:n3, simplified:true}; }
  return null;
}
// later-movement chords are harder, so the finder prefers an F over a Bm
function chordMv(c){ const m = MOVEMENTS.find(m => m.chords.includes(c)); return m ? m.n : 5; }
function capoOptions(chords){
  const uniq = []; const seen = new Set();
  for (const c of chords){ const k = c.root + c.q; if (!seen.has(k)){ seen.add(k); uniq.push(c); } }
  const out = [];
  for (let capo = 0; capo <= 9; capo++){
    const shapes = uniq.map(c => { const sh = shapeFor(c.root - capo, c.q); return {from:c, shape: sh ? sh.name : null, simplified: sh ? sh.simplified : false, known: sh ? knows(sh.name) : false}; });
    const none = shapes.filter(x => !x.shape).length, unknown = shapes.filter(x => x.shape && !x.known).length, simp = shapes.filter(x => x.simplified).length;
    out.push({capo, shapes, none, unknown, simp, score: none * 100 + shapes.filter(x => x.shape && !x.known).reduce((a, x) => a + 8 + 2 * chordMv(x.shape), 0) + simp * 2 + (capo > 7 ? 1.5 : 0) + capo * 0.1});
  }
  return out;
}

/* =========================================================
   Audio: shared context, clicks, plucked strings with techniques
   ========================================================= */
const OPEN_HZ = {6:82.41, 5:110.0, 4:146.83, 3:196.0, 2:246.94, 1:329.63};

// Today's session drawn as one line of a score: three tracks, widths by minutes, with a playhead while the timer runs.
// Today's three tracks as three strings on a fretboard: one fret per minute of the day's target.
// The part of each string you've played lights up, and the string you're practising on right now vibrates.
function heroScore(){
  const b = settings().blocks, tm = trackMinutes(dk());
  const frets = Math.max(...b), pc = m => (clamp(m, 0, frets) / frets * 100).toFixed(2) + '%';
  const inl = [3, 5, 7, 9, 15, 17].filter(n => n <= frets).map(n => `radial-gradient(circle at ${((n - 0.5) / frets * 100).toFixed(2)}% 50%, var(--inlay-board) 0 5px, transparent 5.5px)`);
  const rows = TRACKS.map((t, i) => {
    const m = tm[t.k], tgt = b[i], live = Practice.kind === t.k;
    return `<div class="sline${t.k === 'l' ? ' lead' : ''}${live ? ' live' : ''}${m >= tgt ? ' done' : ''}" style="--w:${[3, 2.2, 1.5][i]}px;--r:${i + 1}">
      <span class="tn">${t.name}</span>
      <div class="sb"><i class="st"></i>${m > 0 ? `<i class="lit" style="width:${pc(Math.min(m, tgt))}"></i><b class="pos" style="left:${pc(Math.min(m, tgt))}"></b>` : live ? `<b class="pos" style="left:0"></b>` : ''}${tgt < frets ? `<i class="tgt" style="left:${pc(tgt)}"></i>` : ''}</div>
      <span class="tv">${m}<small> / ${tgt}</small></span></div>`;
  }).join('');
  return `<div class="hero-score"><div class="strings" role="img" aria-label="Today: ${TRACKS.map((t, i) => `${t.name} ${tm[t.k]} of ${b[i]} minutes`).join(', ')}" style="--frets:${frets}">
    <div class="fbbg" style="background-image:${inl.join(',')}${inl.length ? ',' : ''}repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--frets) - 2px), var(--fretwire) calc(100% / var(--frets) - 2px) calc(100% / var(--frets)))"></div>
    ${rows}</div><p class="note">One fret a minute. Time counts on its own while you drill, strum, play a riff or the microphone hears you, and stops when you stop.</p></div>`;
}
function techPills(l){

// The mixing desk: one fader per song on Side A, set by your slowest change against what the song needs.

function strumLi(x, cur){
  const s = x.s, r = x.r, stt = songState(s.id).status;
  let node = '', pill = '', blk = '';
  if (stt === 'done'){ node = 'done'; pill = `<span class="pill done">Done with the track</span>`; }
  else if (r.missing.length){ pill = `<span class="pill bad">Needs ${esc(r.missing.join(', '))}</span>`; }
  else if (r.ready){ node = 'ready'; pill = `<span class="pill ready">Ready to try with the track</span>`; }
  else { pill = `<span class="pill build">${r.blockers.length} change${r.blockers.length > 1 ? 's' : ''} to speed up</span>`; blk = r.blockers.slice(0, 3).map(b => `<span>${esc(pairLabel(b.k))} <b>${Math.floor(b.have)}</b>/${Math.ceil(b.need)}</span>`).join(''); }
  if (stt === 'learning' || stt === 'slow') pill += ` <span class="chip">${esc(STATUS_LABEL[stt])}</span>`;
  return `<li><div class="node ${node}${cur ? ' cur' : ''}${s.goal ? ' goal' : ''}"><span>${s.goal ? '★' : esc(trackNo(s.id))}</span></div>
    <div class="body"><div><button class="t" type="button" data-act="open-song" data-id="${s.id}">${esc(s.title)}</button></div>
    <div class="sub">${esc(s.artist || 'Your song')} · ${songChords(s).join(' ')} · ${tempoName(s.bpm)} ${s.bpm} · needs ${Math.ceil(r.maxNeed)} changes/min</div>
    <div class="row">${pill}</div>${blk ? `<div class="blk">Your best / needed: ${blk}</div>` : ''}</div></li>`;
}
function viewJourney(){
  const all = strumOrderAll();
  const order = all.filter(x => songInPlay(x.s));
  const later = all.filter(x => !songInPlay(x.s));
  const firstOpen = order.findIndex(x => songState(x.s.id).status !== 'done');
  const strum = order.map((x, i) => strumLi(x, i === firstOpen)).join('');
  const path = leadPath();
  const leadFirst = path.findIndex(l => songState(l.id).status !== 'done');
  const lead = path.map((l, i) => {
    const stt = songState(l.id).status;
    const node = stt === 'done' ? 'done' : (i === leadFirst ? 'lead-ready cur' : '');
    const pill = stt === 'done' ? `<span class="pill done">Done with the track</span>` : stt !== 'new' ? `<span class="pill lead">${esc(STATUS_LABEL[stt])}</span>` : i === leadFirst ? `<span class="pill lead">Up next</span>` : '';
    return `<li><div class="node ${node}${l.goal ? ' goal' : ''}"><span>${l.goal ? '★' : esc(leadTrackNo(l.id))}</span></div><div class="body"><div><button class="t" type="button" data-act="open-lead" data-id="${l.id}">${esc(l.title)}</button></div><div class="sub">${esc(l.artist)} · ${esc(l.genre)}${l.tech.some(t => t !== 'picked') ? ' · ' + l.tech.map(t => TECHS[t].name.toLowerCase()).join(', ') : ''}</div>${pill ? `<div class="row">${pill}</div>` : ''}</div></li>`;
  }).join('');
  const leadLater = leadOrderAll().filter(l => !leadInPlay(l));
  const laterBlock = (items, label) => {
    if (!items.length) return '';
    const byMv = {};
    items.forEach(it => { const n = it.mv; (byMv[n] = byMv[n] || []).push(it.title); });
    return `<div class="later"><div class="eyebrow">${label}</div>${Object.entries(byMv).map(([n, t]) => `<p><b>Movement ${MOVEMENTS[n - 1].num}</b> · ${t.map(esc).join(', ')}</p>`).join('')}<button class="btn sm ghost" data-nav="learn" type="button">See the movements</button></div>`;
  };
  const doneS = order.filter(x => songState(x.s.id).status === 'done').length;
  const doneL = path.filter(l => songState(l.id).status === 'done').length;
  return `
  ${head('Journeys', 'From your first song to Wish You Were Here', 'Side A is strumming, ordered by how fast the chord changes come. Side B is lead. A song turns ready when every change it uses is at or above the speed it needs, and counts as done only after you play it with the track.')}
  <div class="lanes">
    <section class="card side-a"><div class="sec-h"><h3><span class="sidetag">A</span>Strumming</h3><span class="mono muted">${doneS}/${order.length} done</span></div><ol class="path">${strum}</ol>
      ${laterBlock(later.map(x => ({mv:x.s.mv, title:x.s.title})), 'Later on Side A')}</section>
    <section class="card side-b"><div class="sec-h"><h3><span class="sidetag lead">B</span>Lead</h3><span class="mono muted">${doneL}/${path.length} done</span></div>
    <p class="note">${path.every(l => l.tech.every(t => t === 'picked')) ? 'Plain picked notes only for now. Riffs with hammer-ons, slides and bends join this side as you learn each technique.' : 'Riffs join this side as you learn the techniques they use.'}</p><ol class="path">${lead}</ol>
      ${laterBlock(leadLater.map(l => ({mv:leadMv(l), title:l.title})), 'Later on Side B')}</section>
  </div>`;
}

function minutesChart(days, target){
  const W = 960, H = 220, L = 34, R = 10, Tp = 12, B = 30;
  const max = Math.max(target * 1.4, ...days.map(minutesOn), 10);
  const y = v => Tp + (H - Tp - B) * (1 - v / max);
  const bw = (W - L - R) / days.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes practiced, last 14 days">`;
  const step = max > 90 ? 30 : 15;
  for (let v = 0; v <= max; v += step) s += `<line class="gl" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"/><text class="tl" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  days.forEach((k, i) => {
    const m = minutesOn(k); const x = L + i * bw + bw * 0.18; const w = bw * 0.64;
    const h = Math.max(m ? 2 : 3, (H - Tp - B) * m / max);
    s += `<rect class="bar${m >= target ? ' hit' : m ? '' : ' zero'}" x="${x}" y="${m ? y(m) : H - B - 3}" width="${w}" height="${m ? h : 3}" rx="3"><title>${esc(fmtDay(k))}: ${m} min</title></rect>`;
    const [, , dd] = k.split('-');
    if (i % 2 === (days.length - 1) % 2) s += `<text class="tl" x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${Number(dd)}</text>`;
  });
  s += `<line class="tgt" x1="${L}" y1="${y(target)}" x2="${W - R}" y2="${y(target)}"/>`;
  s += '</svg>';
  return s;
}
function pairChart(k, st){
  const hist = (st.hist[k] || []).slice(-30);
  const s0 = settings();
  if (!hist.length) return `<div class="empty"><b>No tests yet for ${esc(pairLabel(k))}.</b><span>Do a one-minute test to start its history.</span><button class="btn sm primary" data-act="open-minute" data-pair="${k}" type="button">One-minute test</button></div>`;
  const W = 960, H = 250, L = 34, R = 16, Tp = 18, B = 30;
  const max = Math.max(s0.hi * 1.25, ...hist.map(h => h.n), 10);
  const y = v => Tp + (H - Tp - B) * (1 - v / max);
  const n = hist.length; const x = i => n === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (n - 1);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="One-minute test history for ${esc(pairLabel(k))}">`;
  const step = max > 60 ? 20 : 10;
  for (let v = 0; v <= max; v += step) s += `<line class="gl" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"/><text class="tl" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  s += `<line class="thr lo" x1="${L}" y1="${y(s0.lo)}" x2="${W - R}" y2="${y(s0.lo)}"/><text class="thl lo" x="${(L + W - R) / 2}" y="${y(s0.lo) - 6}" text-anchor="middle">comfortable ${s0.lo}</text>`;
  s += `<line class="thr hi" x1="${L}" y1="${y(s0.hi)}" x2="${W - R}" y2="${y(s0.hi)}"/><text class="thl hi" x="${(L + W - R) / 2}" y="${y(s0.hi) - 6}" text-anchor="middle">ready ${s0.hi}</text>`;
  const pts = hist.map((h, i) => [x(i), y(h.n)]);
  if (n > 1){
    s += `<path class="area" d="M${pts[0][0]},${y(0)} ${pts.map(p => 'L' + p[0] + ',' + p[1]).join(' ')} L${pts[n - 1][0]},${y(0)} Z"/>`;
    s += `<path class="ln" d="M${pts.map(p => p[0] + ',' + p[1]).join(' L')}"/>`;
  }
  pts.forEach((p, i) => s += `<circle class="pt${i === n - 1 ? ' end' : ''}" cx="${p[0]}" cy="${p[1]}" r="${i === n - 1 ? 5 : 3.5}"><title>${esc(fmtDay(hist[i].d))}: ${hist[i].n}</title></circle>`);
  const cl = st.clean[k];
  if (cl){ s += `<line class="ln2" x1="${L}" y1="${y(cl)}" x2="${W - R}" y2="${y(cl)}"/><text class="tl" x="${W - R}" y="${y(cl) - 5}" text-anchor="end" style="fill:var(--lead)">metronome best ${cl.toFixed(1)}</text>`; }
  s += `<text class="tl" x="${x(0)}" y="${H - 10}" text-anchor="${n === 1 ? 'middle' : 'start'}">${esc(fmtDay(hist[0].d))}</text>`;
  if (n > 1) s += `<text class="tl" x="${x(n - 1)}" y="${H - 10}" text-anchor="end">${esc(fmtDay(hist[n - 1].d))}</text>`;
  s += '</svg>';
  return `<div style="display:grid;gap:6px"><div class="eyebrow">${esc(pairLabel(k))} · one-minute tests</div>${s}</div>`;
}

  {t:'Down strums aim at the root', b:'Start the down strum on the chord’s lowest note: the low E string for G, E and Em, the A string for C, A and Am, the D string for D and Dm. Hitting the strings marked ✕ in a chord diagram is what makes strumming sound muddy.'},

/* =========================================================
   Playing along with the real recording.

   seamlessly, and slower speeds are made by time-stretching (pitch stays the same).

const Player = {

  ready(key){ return this.key === key && !!this.buf; },

    if (hit) return hit;
    const buffer = await wsola(this.buf, speed, s0, s1, progress);
