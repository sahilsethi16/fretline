// WSOLA time-stretch: overlap-add 2048-sample slices, each nudged (±256 samples) to line up with the
// waveform of the previous slice, so the music slows down without the pitch dropping.
async function wsola(buf, speed, s0, s1, progress){
  const sr = buf.sampleRate, N = 2048, Hs = 1024, Ha = Hs * speed, tol = 256, D = 8;
  const i0 = Math.floor(s0 * sr), i1 = Math.min(buf.length, Math.ceil(s1 * sr)), len = i1 - i0;
  const ch = []; for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c).subarray(i0, i1));
  const mono = new Float32Array(len); for (const x of ch) for (let i = 0; i < len; i++) mono[i] += x[i] / ch.length;
  const dec = new Float32Array(Math.ceil(len / D)); for (let i = 0; i < dec.length; i++){ let s = 0; for (let k = 0; k < D && i * D + k < len; k++) s += mono[i * D + k]; dec[i] = s / D; }
  const outLen = Math.ceil(len / speed) + N, out = ch.map(() => new Float32Array(outLen));
  const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
  const OV = N - Hs, frames = Math.floor((outLen - N) / Hs);
  let prev = 0;
  for (let m = 0; m <= frames; m++){
    // centre of each output slice lines up with the centre of its input slice, so beats stay on the grid
    const nominal = Math.max(0, Math.round((m * Hs + N / 2) * speed - N / 2)); let pos = nominal;
    if (m > 0){
      const nat = prev + Hs; // where the previous slice would naturally continue
      let best = -Infinity, bd = 0;
      for (let d = -tol; d <= tol; d += D){
        const p = nominal + d; if (p < 0 || p + N > len) continue;
        let s = 0; const a = p / D | 0, b = nat / D | 0;
        for (let k = 0; k < OV / D; k++) s += dec[a + k] * dec[b + k];
        if (s > best){ best = s; bd = d; }
      }
      let best2 = -Infinity, bd2 = bd;
      for (let d = bd - D + 1; d <= bd + D - 1; d++){
        const p = nominal + d; if (p < 0 || p + N > len || nat + OV > len) continue;
        let s = 0; for (let k = 0; k < OV; k += 2) s += mono[p + k] * mono[nat + k];
        if (s > best2){ best2 = s; bd2 = d; }
      }
      pos = clamp(nominal + bd2, 0, Math.max(0, len - N));
    }
    const o = m * Hs;
    for (let c = 0; c < ch.length; c++){ const x = ch[c], y = out[c]; for (let i = 0; i < N && pos + i < len; i++) y[o + i] += x[pos + i] * win[i]; }
    prev = pos;
    if (m % 400 === 0){ progress && progress(m / frames); await new Promise(r => setTimeout(r, 0)); }
  }
  const res = AudioEng.ctx.createBuffer(ch.length, outLen, sr);
  out.forEach((y, c) => res.copyToChannel(y, c));
  return res;
}

/* ---------- the song's chart: beats, bar lines, a chord per beat, sections ---------- */
const rle = a => { const o = []; for (const c of a){ const l = o[o.length - 1]; if (l && l[0] === c) l[1]++; else o.push([c, 1]); } return o; };
const unrle = r => { const o = []; for (const [c, n] of r) for (let i = 0; i < n; i++) o.push(c); return o; };
// Everything a run needs, from the stored sync (automatic or tapped).
function songChart(sync, song, dur){
  if (!sync) return null;
  const nudge = sync.nudge || 0, ts = song.ts || 4;
  let beats, phase, lab, sections, auto = !!(sync.beats && sync.chart);
  if (sync.beats && sync.beats.length > 8){
    beats = sync.beats.map(t => t + nudge);
  } else { // tapped: a steady grid from the first beat
    const bd = 60 / sync.bpm, first = sync.first + nudge, d = dur || first + 600 * bd; beats = [];
    for (let t = first - Math.floor(first / bd) * bd; t < d; t += bd) beats.push(t);
  }
  if (sync.chart){
    phase = sync.chart.phase; lab = unrle(sync.chart.labels); sections = sync.chart.sections;
  } else {
    const fi = beats.reduce((bi, t, i) => Math.abs(t - (sync.first + nudge)) < Math.abs(beats[bi] - (sync.first + nudge)) ? i : bi, 0);
    phase = fi % ts; const loop = unrle(song.seq.map(([c, n]) => [c, n])); lab = beats.map((_, i) => i < fi ? 'N' : loop[(i - fi) % loop.length]);
    const nb = Math.floor((beats.length - phase) / ts); sections = [{name:'Whole song', group:'g0', n:1, from:0, to:nb}];
  }
  while (lab.length < beats.length) lab.push('N');
  const nb = Math.floor((beats.length - phase) / ts);
  return {beats, phase, lab, sections, ts, nb, auto,
    beatTime(i){ const B = beats, L = B.length - 1; if (i < 0) return B[0] + i * (B[1] - B[0]); if (i > L) return B[L] + (i - L) * (B[L] - B[L - 1]); return B[i]; },
    barTime(j){ return this.beatTime(phase + j * ts); },
    chordAtAbs(i){ return i >= 0 && i < lab.length ? lab[i] : 'N'; },
    // continuous beat index for a song time
    beatAt(t){ const B = beats, L = B.length - 1; if (t < B[0]) return (t - B[0]) / (B[1] - B[0]); if (t >= B[L]) return L + (t - B[L]) / (B[L] - B[L - 1]); let lo = 0, hi = L; while (hi - lo > 1){ const m = (lo + hi) >> 1; if (B[m] <= t) lo = m; else hi = m; } return lo + (t - B[lo]) / (B[lo + 1] - B[lo]); },
  };
}
function chartOfSong(){ const s = scSong(); if (!s) return null; return songChart(scSync(), s, Player.ready(scKey()) ? Player.buf.duration : 0); }
// bar summary for the chart grid: "Em", or "Am  G" when it changes inside the bar
function barChords(ch, j){ const out = []; for (let k = 0; k < ch.ts; k++){ const c = ch.chordAtAbs(ch.phase + j * ch.ts + k); if (!out.length || out[out.length - 1] !== c) out.push(c); } return out; }

/* ---------- run timing for the recording ---------- */
// Run slot k → song time. Whole song: slot 0 is bar 0. Section loop: each pass is a lead-in bar plus the section.
function songSlotTime(run, kAbs){ // song time of an absolute slot (slot 0 = bar 0)
  const ch = run.chart, b = Math.floor(kAbs / run.sub), r = kAbs - b * run.sub;
  const frac = run.swing && run.sub === 2 && r === 1 ? run.swing : r / run.sub;
  const t0 = ch.beatTime(ch.phase + b); return t0 + frac * (ch.beatTime(ch.phase + b + 1) - t0);
}
function recSlotTime(run, k){
  const L = run.loop;
  if (!L) return run.T0 + (songSlotTime(run, k) - run.from) / run.speed;
  const p = Math.floor(k / L.slots), local = k - p * L.slots;
  return run.T0 + p * L.dur + (songSlotTime(run, L.k0 + local) - run.from) / run.speed;
}
function recTimeToSlot(run, t){
  const L = run.loop, ch = run.chart; let p = 0, songT;
  if (!L) songT = run.from + (t - run.T0) * run.speed;
  else { p = Math.max(0, Math.floor((t - run.T0) / L.dur)); songT = run.from + (t - run.T0 - p * L.dur) * run.speed; }
  const bf = ch.beatAt(songT) - ch.phase, b = Math.floor(bf);
  let kAbs = b * run.sub + Math.round((bf - b) * run.sub);
  let k = L ? p * L.slots + (kAbs - L.k0) : kAbs, best = k;
  for (const c of [k - 1, k + 1]) if (Math.abs(recSlotTime(run, c) - t) < Math.abs(recSlotTime(run, best) - t)) best = c;

}
// run beat → absolute beat index in the song
function recAbsBeat(run, b){ const L = run.loop; if (!L) return run.chart.phase + b; const pb = L.slots / run.sub; const local = ((b % pb) + pb) % pb; return run.chart.phase + L.k0 / run.sub + local; }

/* ---------- microphone + onset detection ---------- */
// The detector class (src/sfdet.js) runs inside an AudioWorklet so it sees every 128-sample block on time.
const ONSET_WORKLET = SFDET_SRC + `
class OnsetProc extends AudioWorkletProcessor{
  constructor(){
    super(); this.det = new SFDet(sampleRate); this.pk = 0; this.lt = 0;
    this.port.onmessage = e => { const d = e.data || {}; if (d.sens) this.det.setSens(d.sens); };
  }
  process(inputs){
    const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
    let pk = 0; for (let i = 0; i < ch.length; i++){ const a = ch[i] < 0 ? -ch[i] : ch[i]; if (a > pk) pk = a; }
    if (pk > this.pk) this.pk = pk;
    const t = currentTime;
    for (const o of this.det.feed(ch, t + ch.length / sampleRate)) this.port.postMessage({type:'onset', t: o.t, e: o.e});
    if (t - this.lt > 0.05){ this.port.postMessage({type:'level', pk: this.pk}); this.pk = 0; this.lt = t; }
    return true;
  }
}
registerProcessor('onset-proc', OnsetProc);`;
// Sensitivity 1–10: higher hears softer strums (and more stray noise).
function sensParams(){ return {sens: clamp(Number(scCfg().sens) || 7, 1, 10)}; }
async function micStart(){
  const ctx = AudioEng.ensure();
  if (!ctx){ sc.mic.state = 'unsupported'; sc.mic.err = 'This browser has no Web Audio.'; scRender(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ sc.mic.state = 'unsupported'; sc.mic.err = window.isSecureContext ? 'This browser does not offer microphone access.' : 'Microphone access needs a secure page.'; scRender(); return; }
  sc.mic.state = 'asking'; scRender();
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}); }
  catch(e){ sc.mic.state = 'blocked'; sc.mic.err = (e && e.name) || 'Error'; scRender(); return; }
  sc.mic.stream = stream;
  const src = ctx.createMediaStreamSource(stream); sc.mic.src = src;
  const sink = ctx.createGain(); sink.gain.value = 0; sink.connect(ctx.destination); sc.mic.sink = sink;
  try{
    try{ await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([ONSET_WORKLET], {type:'application/javascript'}))); }
    catch(e1){ await ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,' + encodeURIComponent(ONSET_WORKLET)); }
    const node = new AudioWorkletNode(ctx, 'onset-proc', {numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[1]});
    node.port.onmessage = e => onMicMsg(e.data);

  }catch(e){
    sc.mic.workletErr = String(e && (e.message || e.name) || e);

    sp.onaudioprocess = ev => {
      const ch = ev.inputBuffer.getChannelData(0); const t0 = ev.playbackTime - 512 / ctx.sampleRate;

      for (let o = 0; o < ch.length; o += 128){

}
function micStop(){
  try{ sc.mic.stream && sc.mic.stream.getTracks().forEach(t => t.stop()); }catch(e){}

function onMicMsg(d){

// One-minute changes, hands-free: every strum the mic hears is one change.
function omMicStrum(){
  const now = performance.now();

/* ---------- backing-track sounds ---------- */
const NOTE_PC = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
function chordRootHz(name){ const m = /^([A-G])(#?)/.exec(name); if (!m) return 110; const pc = NOTE_PC[m[1]] + (m[2] ? 1 : 0); return 41.2 * Math.pow(2, ((pc - 4 + 12) % 12) / 12); } // E1 = 41.2 Hz upward

      const ex = run.extras.find(x => x.k === k && x.rest); if (ex){ cls += ' extra'; note = 'extra'; }
      if (k === cur && cur >= 0) cls += ' now';
      if (el.className !== cls) el.className = cls;
      const nEl = el.lastElementChild; if (nEl.textContent !== note) nEl.textContent = note;
    }
  }
  // stats, meter, bar strip (cheap enough to redo each frame only when the finalized slot moves)
  if (run.fin !== run.lastFin || run.hitsN !== Object.keys(run.hits).length){
    run.lastFin = run.fin; run.hitsN = Object.keys(run.hits).length;
    const s = runStats(run); scLive(s, run);
  }
  run.raf = requestAnimationFrame(scDraw);
}
function feel(ms){ return ms == null ? '' : Math.abs(ms) < 12 ? 'right on it' : ms < 0 ? `${Math.round(-ms)} ms early` : `${Math.round(ms)} ms late`; }
function scLive(s, run){
  const set = (id, v) => { const e = $(id); if (e && e.innerHTML !== String(v)) e.innerHTML = v; };
  set('#scAcc', s.exp ? Math.round(s.acc * 100) + '<small>%</small>' : '–');
  set('#scMean', s.recent.length ? (s.mean > 0 ? '+' : '') + Math.round(s.mean) + '<small> ms</small>' : '–');
  set('#scMeanL', !s.recent.length ? 'average timing' : Math.abs(s.mean) < 12 ? 'right on the beat' : s.mean < 0 ? 'rushing (early)' : 'dragging (late)');
  set('#scSd', s.recent.length > 1 ? Math.round(s.sd) + '<small> ms</small>' : '–');
  set('#scStreak', s.streak);
  set('#scMiss', `${s.miss} missed · ${s.extras} extra`);
  const m = $('#scMeter');
  if (m){
    const x = v => 50 + clamp(v, -100, 100) / 2;
    m.innerHTML = s.recent.map((h, i) => `<i class="${Math.abs(h.dt) <= GOOD_MS ? 'g' : Math.abs(h.dt) <= OK_MS ? 'o' : 'b'}" style="left:${x(h.dt)}%;opacity:${(0.25 + 0.75 * (i + 1) / s.recent.length).toFixed(2)}"></i>`).join('') + (s.recent.length ? `<b style="left:${x(s.mean)}%"></b>` : '');

}

/* ---------- calibration: bleed check + latency ---------- */
function calStart(){
  if (sc.mic.state !== 'on'){ toast('Turn on the microphone first.'); return; }
  if (sc.run) scStop();
  const ctx = AudioEng.ensure();
  const spb = 60 / 90; const t0 = ctx.currentTime + 0.3;
  // Phase 1: play two bars of the guide strum while you stay silent.
  sc.cal = {phase:'bleed', t0, end: t0 + 8 * spb, heard: 0};
  for (let i = 0; i < 8; i++){ AudioEng.click(t0 + i * spb, i % 4 ? 'tick' : 'accent'); guideStrum(t0 + i * spb, i < 4 ? 'G' : 'C', 'D', 0.9, spb); }
  sc.cal.timer = setTimeout(calLatency, (sc.cal.end - ctx.currentTime + 0.4) * 1000);
  scRender();
}
function calLatency(){
  if (!sc.cal) return;
  const ctx = AudioEng.ctx; const spb = 60 / 80;
  const heard = sc.cal.heard;
  const t0 = ctx.currentTime + 0.4;
  const clicks = [];
  for (let i = 0; i < 12; i++){ const t = t0 + i * spb; AudioEng.click(t, i < 4 ? 'count' : i % 4 === 0 ? 'accent' : 'tick'); if (i >= 4) clicks.push(t); }
  sc.cal = {phase:'latency', bleed: heard, clicks, got: [], t0};
  sc.cal.timer = setTimeout(calFinish, (clicks[clicks.length - 1] - ctx.currentTime + 0.8) * 1000);
  scRender();
}
function calOnset(t){
  const c = sc.cal; if (!c) return;
  if (c.phase === 'bleed'){ if (t > c.t0 - 0.05 && t < c.end + 0.3) c.heard++; return; }
  let best = null; for (const ct of c.clicks){ const d = t - ct; if (d > -0.1 && d < 0.3 && (best === null || Math.abs(d) < Math.abs(best))) best = d; }
  if (best !== null) c.got.push(best);
  const g = $('#calGot'); if (g) g.textContent = c.got.length + ' of 8 strums heard';
}
function calFinish(){
  const c = sc.cal; if (!c) return;
  const got = c.got.slice().sort((a, b) => a - b);
  let res;
  if (got.length >= 5){
    const med = got[Math.floor(got.length / 2)];
    const mad = got.map(x => Math.abs(x - med)).sort((a, b) => a - b)[Math.floor(got.length / 2)];
    store.data.strum.cfg.latency = med; touch('strum');
    res = {ok:true, ms: Math.round(med * 1000), spread: Math.round(mad * 1000), n: got.length};
  } else res = {ok:false, n: got.length};
  sc.cal = null; sc.calResult = Object.assign(res, {bleed: c.bleed});
  scRender();
}
function calCancel(){ if (sc.cal){ clearTimeout(sc.cal.timer); sc.cal = null; scRender(); } }

/* ---------- MP3: load, remember, tap-sync ---------- */
const IDB = {
  db:null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { try{ const r = indexedDB.open('fretline-strum', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); },
  async put(k, v){ try{ const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }catch(e){} },
  async get(k){ try{ const db = await this.open(); return await new Promise((res) => { const tx = db.transaction('files', 'readonly'); const r = tx.objectStore('files').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }catch(e){ return null; } },
};
async function mp3Attach(blob, name, key, analyze){
  const m = sc.mp3; Player.stop();
  m.name = name; m.songKey = key; m.taps = []; m.tapping = false; m.loading = true; m.loadErr = ''; scRender();
  try{ await Player.load(blob, key); m.dur = Player.buf.duration; }
  catch(e){ m.loadErr = 'This file couldn’t be opened as audio.'; Player.key = null; }
  m.loading = false; scRender();
  if (Player.ready(key) && (analyze || !scSync())) mp3Analyze(key);
}
// Automatic sync: find every beat, a chord for every beat, the bar lines, and the song's sections.
async function mp3Analyze(key){
  const s = songById(key); if (!s || !window.BeatSync || !Player.ready(key)) return;
  const m = sc.mp3; m.analyzing = {key, p:0}; m.analyzeErr = ''; scRender();
  try{
    const buf = Player.buf;
    const off = new OfflineAudioContext(1, Math.ceil(buf.duration * BeatSync.SR), BeatSync.SR);
    const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
    const x = (await off.startRendering()).getChannelData(0);
    const r = await BeatSync.analyze(x, {bpm: s.bpm, seq: s.seq, shapes: SHAPES, capo: s.capo || 0, ts: s.ts || 4}, p => { m.analyzing.p = p; const e = $('#bsProg'); if (e) e.style.width = Math.round(p * 100) + '%'; });
    if (r.beats.length < 8) throw new Error('No steady beat found');
    const chart = r.chart ? {phase: r.chart.phase, labels: rle(r.chart.labels), sections: r.chart.sections} : null;
    store.data.strum.sync[key] = {bpm: Math.round(r.bpm * 10) / 10, first: Math.round(r.beats[r.start] * 1000) / 1000, nudge: 0, auto: true, conf: r.conf, i0: r.start, beats: r.beats.map(t => Math.round(t * 1000) / 1000), chart};
    sc.section = null; touch('strum');
  }catch(e){ m.analyzeErr = String(e && (e.message || e.name) || e); }
  m.analyzing = null; scRender();
}
// Move the bar lines a beat earlier or later (the chords stay where they are in the music).
function syncShift(beats){
  const sy = scSync(); if (!sy) return;
  if (sy.chart){ const ts = (scSong() || {}).ts || 4; sy.chart.phase = ((sy.chart.phase + beats) % ts + ts) % ts; }
  else sy.first = Math.max(0, Math.round((sy.first + beats * 60 / sy.bpm) * 1000) / 1000);
  touch('strum'); render();
}
async function mp3Restore(){
  const key = scKey(); if (sc.mp3.songKey === key && (Player.ready(key) || sc.mp3.loading)) return;
  const rec = await IDB.get('song:' + key);
  if (rec && rec.blob && scKey() === key) mp3Attach(rec.blob, rec.name, key, false);
}
function syncPanel(sync){
  const m = sc.mp3, ts = scPat().ts;
  if (m.analyzing) return `<div class="eyebrow">Finding the beat and the chords</div><p>Listening through the whole song for the beat, the chords and the sections. This takes a few seconds and happens on this computer.</p><div class="lvlbar"><i id="bsProg" style="width:${Math.round(m.analyzing.p * 100)}%"></i></div>`;
  if (m.tapping) return `<div class="eyebrow">Tap the beat</div><p>Tap <span class="kbd">T</span> or the button on every beat, starting on beat 1 where the first chord comes in. At least 8 taps. Taps: <b class="mono" id="tapN">${m.taps.length}</b></p>
    <div class="row"><button class="btn primary sm" type="button" data-act="sc-tap">Tap</button><button class="btn sm" type="button" data-act="sc-tapdone">Done</button></div>`;
  const err = m.analyzeErr ? `<p class="err">Automatic sync didn’t work on this file (${esc(m.analyzeErr)}). Tap along instead.</p>` : '';
  if (!sync) return `<div class="eyebrow">Sync the beat</div>${err}<div class="row"><button class="btn sm" type="button" data-act="sc-detect">Find the beat automatically</button><button class="btn sm ghost" type="button" data-act="sc-tap">Tap along instead</button></div>`;
  const conf = !sync.auto ? 'Synced by tapping. The chords repeat the song’s main loop; detect automatically to get the whole song’s chords and sections.'
    : !sync.chart ? 'Detect again to get the whole song’s chords and sections.'
    : {high:'The chords match the music well.', medium:'Mostly sure. Check the song map below as it plays, and fix any bar that’s wrong.', low:'Not sure about the chords: the recording may be in a different key from this chart. Check the song map and fix bars as needed.'}[sync.conf || 'low'];
  return `<div class="eyebrow">${sync.auto ? 'Synced automatically' : 'Synced'} · ${sync.bpm} bpm${sync.chart ? ` · ${sync.chart.sections.length} sections` : ''}</div>

      <div class="field"><label>Bar lines</label><div class="row"><button class="btn sm ghost" type="button" data-act="sc-shift" data-v="-1">1 beat earlier</button><button class="btn sm ghost" type="button" data-act="sc-shift" data-v="1">1 beat later</button></div></div>
      <div class="field"><label>Beat grid</label><div class="row"><button class="btn sm ghost" type="button" data-act="sc-nudge" data-v="-0.02">20 ms earlier</button><button class="btn sm ghost" type="button" data-act="sc-nudge" data-v="0.02">20 ms later</button></div></div>
      <div class="row"><button class="btn sm ghost" type="button" data-act="sc-detect">Detect again</button><button class="btn sm ghost" type="button" data-act="sc-tap">Tap instead</button></div>
    </details>`;
}
function tapSync(){
  const m = sc.mp3; if (!Player.ready(scKey())) return;
  const ctx = AudioEng.ensure();
  if (!m.tapping){ m.tapping = true; m.taps = []; Player.stop(); m.tapT0 = ctx.currentTime + 0.1; Player.play({buffer: Player.buf, s0: 0}, 1, 0, Player.buf.duration, m.tapT0); scRender(); return; }
  m.taps.push(ctx.currentTime - m.tapT0 - (ctx.outputLatency || 0.02));
  const n = $('#tapN'); if (n) n.textContent = m.taps.length;
}
function tapFinish(){
  const m = sc.mp3; const ts = m.taps; m.tapping = false; Player.stop();
  if (ts.length < 8){ toast('Tap at least 8 beats in a row.'); scRender(); return; }
  // straight-line fit of tap time against beat number: slope is the beat length, intercept is beat 1
  const n = ts.length, xs = ts.map((_, i) => i); const mx = (n - 1) / 2, my = ts.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ts[i] - my); den += (x - mx) ** 2; });
  const slope = num / den, icpt = my - slope * mx;
  const bpm = 60 / slope;
  if (!(bpm > 30 && bpm < 240)){ toast('Those taps were too uneven. Try again.'); scRender(); return; }
  store.data.strum.sync[scKey()] = {bpm: Math.round(bpm * 10) / 10, first: Math.max(0, Math.round(icpt * 1000) / 1000), nudge: 0, auto: false};
  sc.section = null; touch('strum'); toast(`Synced: ${Math.round(bpm)} bpm, first beat at ${icpt.toFixed(2)} s.`); scRender();
}

    const k = $('#lpKey'); if (k) k.textContent = lp.key ? 'capo ' + lp.key : 'no capo';
    if (fl.on){ fl.msg = `Play ${targetLabel()}.`; flMsg(); }
  }

/* =========================================================
   Practice time: counted from what you actually do, not a countdown.
   A second counts when a drill, a strum run, a one-minute test or lead playback is going, or when the
   microphone hears you playing. Away from the screen, a stopwatch you start yourself; with the mic on
   it pauses when you stop playing. Time is saved every few seconds, per device, and adds up across devices.
   ========================================================= */
const TRACKS = [{k:'c', name:'Chord changes'}, {k:'s', name:'Strumming'}, {k:'l', name:'Lead'}];
const DEVICE = (() => { try{ let d = localStorage.getItem('fretline:device'); if (!d){ d = 'd' + Math.random().toString(36).slice(2, 10); localStorage.setItem('fretline:device', d); } return d; }catch(e){ return 'local'; } })();
const Practice = {kind:null, last:Date.now(), lastSave:0, dirty:false, iv:0, sw:null, shownMin:-1};
const SILENCE_PAUSE = 120000, SW_MAX = 90 * 60 * 1000;

// seconds practised on a day, per track, summed over every device
function daySeconds(k){
  const out = {c:0, s:0, l:0}, dev = store.data.sessions.dev || {};
  for (const d of Object.values(dev)){ const x = d[k]; if (x) for (const t of 'csl') out[t] += x[t] || 0; }
  return out;
}
function minutesOn(k){
  const s = daySeconds(k);
  return (store.data.sessions.days[k] || 0) + Math.floor((s.c + s.s + s.l) / 60); // days[] holds minutes from the old timer
}
function trackMinutes(k){ const s = daySeconds(k); return {c: Math.floor(s.c / 60), s: Math.floor(s.s / 60), l: Math.floor(s.l / 60)}; }

function heardRecently(ms){ return sc.mic.state === 'on' && sc.mic.lastOnset && performance.now() - sc.mic.lastOnset < ms; }
function practiceKind(){
  const quiet = sc.mic.state === 'on' && !heardRecently(30000);
  if (sc.run) return quiet && Date.now() - sc.run.startedAt > 30000 ? null : 's';   // mic on but silent for 30 s: you've stopped
  if (cs.running) return 'c';
  if (om.phase === 'run' || om.phase === 'count') return 'c';
  if (lp.playing) return 'l';
  if (fl.on) return heardRecently(30000) ? 'l' : null;
  if (Practice.sw && !Practice.sw.paused) return Practice.sw.kind;
  if (heardRecently(10000)) return ui.view === 'lead' ? 'l' : ui.view === 'changes' ? 'c' : 's';
  return null;
}
// A new day (or a new part of the day, for the greeting) redraws Today, even if the app was left open.
function checkDayChange(){
  const d = new Date(), stamp = dk(d) + ':' + (d.getHours() < 12 ? 0 : d.getHours() < 18 ? 1 : 2);
  if (Practice.stamp && Practice.stamp !== stamp){ if (ui.view === 'today') render(); else { renderRail(); renderNav(); } }
  Practice.stamp = stamp;
}
function practiceTick(){
  checkDayChange();
  const now = Date.now(); let dt = (now - Practice.last) / 1000; Practice.last = now;
  const sw = Practice.sw;
  if (sw && !sw.paused){
    if (sc.mic.state === 'on' && !heardRecently(SILENCE_PAUSE) && now - sw.resumedAt > SILENCE_PAUSE){ sw.paused = true; sw.why = 'Paused: nothing heard for 2 minutes'; }
    if (now - sw.startedAt > SW_MAX){ swStop(); toast('The stopwatch stopped itself after 90 minutes.'); }
  }
  const kind = practiceKind();
  // background tabs can tick late; only count a gap if the same thing was going before and after it
  if (kind && dt > 0 && (kind === Practice.kind || dt <= 1.5)) addPractice(kind, Math.min(dt, 65));
  const changed = kind !== Practice.kind; Practice.kind = kind;
  if (Practice.dirty && (now - Practice.lastSave > 10000 || changed)) practiceSave();
  if (sw && !sw.paused && kind === sw.kind && dt > 0 && (changed ? dt <= 1.5 : true)) sw.secs += Math.min(dt, 65);
  const min = minutesOn(dk());
  if (min !== Practice.shownMin || changed){ Practice.shownMin = min; renderRail(); }
  if (ui.view === 'today') refreshTodayTracks();
  updateMini();
}
function addPractice(kind, sec){
  const S = store.data.sessions; S.dev = S.dev || {};
  const d = S.dev[DEVICE] = S.dev[DEVICE] || {}, k = dk();
  const x = d[k] = d[k] || {c:0, s:0, l:0};
  x[kind] = Math.round(((x[kind] || 0) + sec) * 10) / 10;
  Practice.dirty = true;
}
function practiceSave(){ if (!Practice.dirty) return; Practice.dirty = false; Practice.lastSave = Date.now(); touch('sessions'); }
function practiceInit(){
  clearInterval(Practice.iv); Practice.last = Date.now(); Practice.iv = setInterval(practiceTick, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) practiceSave(); else checkDayChange(); });
  window.addEventListener('pagehide', practiceSave);
}
/* stopwatch for practice away from the app */
function swStart(kind){ Practice.sw = {kind, startedAt: Date.now(), resumedAt: Date.now(), secs:0, paused:false, why:''}; Practice.last = Date.now(); Practice.kind = kind; updateMini(); render(); }
function swToggle(){ const sw = Practice.sw; if (!sw) return; sw.paused = !sw.paused; sw.why = ''; if (!sw.paused) sw.resumedAt = Date.now(); updateMini(); render(); }
function swStop(){ const sw = Practice.sw; if (!sw) return; Practice.sw = null; practiceSave(); const m = Math.floor(sw.secs / 60); toast(m ? `${m} min of ${TRACKS.find(t => t.k === sw.kind).name.toLowerCase()} counted.` : 'Stopped. Under a minute, but the seconds still count.'); render(); }
function updateMini(){
  const m = $('#minitimer'); if (!m) return;
  const sw = Practice.sw, kind = Practice.kind;
  const show = !!sw || !!kind; m.classList.toggle('show', show && ui.view !== 'today'); m.classList.toggle('paused', !!(sw && sw.paused));
  if (!show) return;
  const t = TRACKS.find(x => x.k === (sw ? sw.kind : kind));
  $('#mtLabel').textContent = sw ? (sw.paused ? 'Paused · ' : 'Stopwatch · ') + t.name : 'Practising · ' + t.name;
  $('#mtClock').textContent = sw ? fmtClock(sw.secs) : trackMinutes(dk())[kind] + ' min';
}
// Today's three tracks: live minutes and bars, without re-rendering the whole page
function refreshTodayTracks(){
  const tm = trackMinutes(dk()), b = settings().blocks;
  TRACKS.forEach((t, i) => {
    const el = $('#trk-' + t.k); if (!el) return;
    el.querySelector('b').textContent = Math.min(tm[t.k], 999);
    el.querySelector('i').style.width = Math.round(clamp(tm[t.k] / b[i], 0, 1) * 100) + '%';
    el.closest('.slot') && el.closest('.slot').classList.toggle('live', Practice.kind === t.k);
  });
  const sb = $('#swClock'); if (sb && Practice.sw) sb.textContent = fmtClock(Practice.sw.secs);
  const hs = $('.hero-score'); if (hs){ const html = heroScore(); if (hs.outerHTML !== html) hs.outerHTML = html; }
}

/* =========================================================
   Backup: export every section to one JSON file, import it on another device or app.
   Importing merges: history from both sides is kept; settings come from the file.
   ========================================================= */
async function exportProgress(){
  const payload = {app:'fretline', format:1, exported:new Date().toISOString(), device:DEVICE, data:store.data};
  const json = JSON.stringify(payload), filename = `fretline-progress-${dk()}.json`;
  let dl = null;
  try{ dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if (dl){
    try{ await dl.save({filename, data: json}); toast('Progress exported.'); }
    catch(e){ if (e && e.code !== 'declined') toast('The file couldn’t be saved here (' + ((e && e.code) || 'error') + ').'); }
    return;
  }
  // outside Claude: a normal browser download
  const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Progress exported.');
}
async function importProgress(file){
  let o;
  try{ o = JSON.parse(await file.text()); }catch(e){ toast('That file isn’t a Fretline backup.'); return; }
  const d = o && o.app === 'fretline' && o.data && typeof o.data === 'object' ? o.data : null;
  if (!d){ toast('That file isn’t a Fretline backup.'); return; }
  const before = {drills: store.data.drills.items.length, runs: store.data.strum.runs.length};
  for (const s of SECTIONS){
    if (!d[s]) continue;
    const incoming = mergeSection(s, d[s]);
    store.data[s] = mergeRemoteLocal(s, incoming, store.data[s]);
    touch(s); if (store.db) flush(s);
  }
  const added = store.data.drills.items.length - before.drills, runs = store.data.strum.runs.length - before.runs;
  toast(`Imported the backup from ${fmtDay(dk(new Date(o.exported || Date.now())))}: ${added} new one-minute tests, ${runs} new strum runs, plus songs, riffs, song maps and practice time.`);
  render();
}
function backupHTML(){
  return `<div class="field wide"><label>Backup</label>
    <div class="row"><button class="btn sm" type="button" data-act="bk-export">Export my progress</button>
    <label class="btn sm ghost"><input type="file" accept=".json,application/json" data-act="bk-import" hidden>Import a backup</label></div>
    <span class="note">One file with everything: tests, tempos, songs, riffs, strum runs, song maps and practice time. Importing adds to what’s here; nothing is deleted. Song audio files aren’t included.</span></div>`;
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act="bk-export"]'); if (el) exportProgress(); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.act === 'bk-import' && el.files && el.files[0]){ importProgress(el.files[0]); el.value = ''; } });

/* =========================================================
   Trainer engine
   ========================================================= */
const T = {timer:0, raf:0, next:0, n:0, queue:[], seq:null, loopBeats:0, countIn:0, lastLoop:0, cur:null};
function trStart(){
  const ctx = AudioEng.ensure(); if (!ctx){ toast('Audio is not available in this browser.'); return; }
  T.seq = drillSeq(); T.loopBeats = T.seq.reduce((a, x) => a + x[1], 0);
  T.countIn = cs.countIn ? cs.ts : 0; T.n = 0; T.queue = []; T.lastLoop = 0; T.cur = null;
  T.next = ctx.currentTime + 0.15;
  cs.running = true;
  clearInterval(T.timer); T.timer = setInterval(trSchedule, 25); trSchedule();
  cancelAnimationFrame(T.raf); T.raf = requestAnimationFrame(trDraw);
  syncPlayBtn();
}
function trStop(){
  if (!cs.running) return;
  cs.running = false; clearInterval(T.timer); cancelAnimationFrame(T.raf); T.queue = [];
  syncPlayBtn();
  $$('#trBeats i').forEach(i => i.classList.remove('on'));
  $$('#strum span').forEach(s => s.classList.remove('on'));
}
function syncPlayBtn(){
  const b = $('#trPlay'); if (!b) return;
  b.classList.toggle('stop', cs.running); b.innerHTML = cs.running ? stopIcon : playIcon; b.setAttribute('aria-label', cs.running ? 'Stop' : 'Start');
}
function beatInfo(n){
  if (n < T.countIn) return {count:true, n, barBeat:n};
  const m = n - T.countIn; const loop = Math.floor(m / T.loopBeats); let r = m % T.loopBeats; let ci = 0;
  while (r >= T.seq[ci][1]){ r -= T.seq[ci][1]; ci++; }
  return {loop, ci, inChord:r, barBeat: m % cs.ts};
}
function trSchedule(){
  const ctx = AudioEng.ctx;
  while (T.next < ctx.currentTime + 0.12){
    const info = beatInfo(T.n);
    if (!info.count && info.loop > T.lastLoop){
      T.lastLoop = info.loop;
      if (cs.ramp.on && info.loop % Math.max(1, cs.ramp.every) === 0 && cs.bpm < cs.ramp.max){
        cs.bpm = Math.min(cs.ramp.max, cs.bpm + cs.ramp.step);
        setTimeout(syncBpm, Math.max(0, (T.next - ctx.currentTime) * 1000));
      }
    }
    const kind = info.count ? 'count' : info.inChord === 0 ? 'change' : info.barBeat === 0 ? 'accent' : 'tick';
    AudioEng.click(T.next, kind);
    T.queue.push({time:T.next, info, bpm:cs.bpm});
    T.next += 60 / cs.bpm; T.n++;
  }
}
function trDraw(){
  if (!cs.running) return;
  const now = AudioEng.ctx.currentTime;
  let changed = false;
  while (T.queue.length && T.queue[0].time <= now){ T.cur = T.queue.shift(); changed = true; }
  const c = T.cur;
  if (c && changed){
    const dots = $('#trBeats');
    if (c.info.count){
      if (dots){ dots.innerHTML = Array.from({length: T.countIn}, (_, i) => `<i class="cnt${i <= c.info.n ? ' on' : ''}"></i>`).join(''); }
      const nn = $('#trNow'); if (nn) nn.textContent = T.countIn - c.info.n;
      const nx = $('#trNext'); if (nx) nx.textContent = T.seq[0][0];
    } else {
      const ch = T.seq[c.info.ci][0]; const nxt = T.seq[(c.info.ci + 1) % T.seq.length][0]; const len = T.seq[c.info.ci][1];
      const nn = $('#trNow');
      if (nn && nn.textContent !== ch){ nn.textContent = ch; const dg = $('#trDiag'); if (dg) dg.innerHTML = chordSvg(ch, 1.5); }
      const nx = $('#trNext'); if (nx) nx.textContent = nxt;
      if (dots){
        if (dots.childElementCount !== len || dots.firstElementChild.classList.contains('cnt')) dots.innerHTML = Array.from({length: len}, (_, i) => `<i class="${i === 0 ? 'chg' : ''}"></i>`).join('');
        Array.from(dots.children).forEach((el, i) => el.classList.toggle('on', i <= c.info.inChord));
      }
      const lp_ = $('#trLoop'); if (lp_) lp_.textContent = 'Loop ' + (c.info.loop + 1);
    }
  }
  if (c && cs.strum){
    const beatDur = 60 / c.bpm;
    const sub = Math.min(1, Math.floor((now - c.time) / (beatDur / 2)));
    const pos = c.info.count ? -1 : ((c.info.barBeat % cs.ts) * 2 + sub);
    $$('#strum span').forEach((s, i) => s.classList.toggle('on', i === pos));
  }
  T.raf = requestAnimationFrame(trDraw);
}
function syncBpm(){
  const v = $('#bpmVal'); if (v) v.textContent = cs.bpm;
  const nm = $('#bpmName'); if (nm) nm.textContent = tempoName(cs.bpm);
  const r = $('#bpmRange'); if (r) r.value = cs.bpm;
  const rb = $('#rateBox');
  if (rb && cs.src.type === 'pair') rb.innerHTML = `That's <b>${(cs.bpm / cs.beats).toFixed(1)}</b> changes a minute. <span class="kbd">Space</span> starts and stops.`;
}
function setBpm(v){ cs.bpm = clamp(Math.round(v), 30, 220); syncBpm(); }
function saveClean(){
  const seq = drillSeq();
  const seen = {};
  const t0 = Date.now();
  for (let i = 0; i < seq.length; i++){
    const a = seq[i][0], b = seq[(i+1) % seq.length][0]; if (a === b) continue;
    const k = pk(a, b); const beats = seq[i][1];
    if (seen[k] && seen[k] <= beats) continue; // keep the tightest timing per pair
    seen[k] = beats;
  }
  const entries = Object.entries(seen);
  if (!entries.length){ toast('Pick two different chords first.'); return; }
  entries.forEach(([k, beats]) => store.data.tempos.items.push({d:dk(), t:t0, p:k, bpm:cs.bpm, beats}));
  touch('tempos');
  const label = cs.src.type === 'song' ? `${songById(cs.src.id).title} progression` : pairLabel(cs.src.pair);
  toast(`Saved: ${label} clean at ${cs.bpm} bpm.`, () => { removeTempos(t0); toast('Removed.'); refreshChanges(); });
  refreshChanges();
}
function refreshChanges(){ if (ui.view !== 'changes') return; const running = cs.running; render(); if (running) syncPlayBtn(); }

/* one-minute engine */
function omStart(){
  const ctx = AudioEng.ensure();
  om.phase = 'count'; om.cd = 3; om.count = 0; om.last = null;
  refreshChanges();
  const step = () => {
    if (om.phase !== 'count') return;
    if (ctx) AudioEng.click(ctx.currentTime + 0.01, 'beep');
    const big = $('#omBig'); if (big) big.textContent = om.cd;
    if (om.cd === 0){ om.phase = 'run'; om.t0 = performance.now(); refreshChanges(); omTick(); return; }
    om.cd--; om.timer = setTimeout(step, 1000);
  };
  step();
}
function omTick(){
  if (om.phase !== 'run') return;
  const left = 60 - (performance.now() - om.t0) / 1000;
  const el = $('#omTime'); if (el) el.textContent = Math.max(0, Math.ceil(left));
  if (left <= 0){ omFinish(); return; }
  om.raf = requestAnimationFrame(omTick);
}
function omFinish(){
  const ctx = AudioEng.ctx; if (ctx) AudioEng.click(ctx.currentTime + 0.01, 'end');
  const st = computeStats();
  om.prevBest = st.best[om.pair] || 0;
  om.phase = 'done';
  addDrill(om.pair, om.count);
  om.last = store.data.drills.items[store.data.drills.items.length - 1].t;
  refreshChanges(); renderNav();
}
function omStop(silent){
  clearTimeout(om.timer); cancelAnimationFrame(om.raf);
  if (om.phase === 'count' || om.phase === 'run'){ om.phase = 'idle'; om.count = 0; }
  if (!silent) refreshChanges();
}
function omTap(){
  if (om.phase === 'idle' || om.phase === 'done'){ omStart(); return; }
  if (om.phase !== 'run') return;
  om.count++;
  const big = $('#omBig'); if (big) big.textContent = om.count;
  const p = $('#omPair'); if (p){ const sp = p.querySelectorAll('span'); sp[0].className = om.count % 2 === 0 ? 'a' : ''; sp[1].className = om.count % 2 ? 'a' : ''; }
}

/* =========================================================
   Lead playback
   ========================================================= */
const P = {timer:0, raf:0, events:[], total:0, start:0, idx:0, loopN:0, queue:[], next:0, endAt:0, clickT:0, bars:[]};
function lpCurrent(){
  const r = riffData(lp.riffId);
  return {r, text: lp.text !== null ? lp.text : r.text, bpm: lp.bpm || r.bpm, sound: lp.sound || settings().sound};
}
function lpStart(noCount){
  if (fl.on) flStop(true);
  const ctx = AudioEng.ensure(); if (!ctx){ toast('Audio is not available in this browser.'); return; }
  const {r, text} = lpCurrent();
  const parsed = parseRiff(text);
  if (!parsed.events.some(e => !e.rest)){ toast('Add some notes first.'); return; }
  P.events = parsed.events; P.total = parsed.total; P.bars = parsed.bars;
  const beatsPerBar = r.tsDen === 8 ? r.ts / 2 : r.ts;
  const spb = 60 / lpCurrent().bpm;
  const ci = lp.countIn && !noCount ? Math.ceil(beatsPerBar) : 0;
  P.bpb = Math.max(1, Math.round(beatsPerBar));
  P.start = ctx.currentTime + 0.15;
  for (let i = 0; i < ci; i++) AudioEng.click(P.start + i * spb, 'count');
  P.start += ci * spb;
  P.idx = 0; P.loopN = 0; P.queue = []; P.clickT = 0; P.clickStart = P.start;
  AudioEng.resetVoices();
  lp.playing = true;
  clearInterval(P.timer); P.timer = setInterval(lpSchedule, 25); lpSchedule();
  cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(lpDraw);
  syncLpBtn();
}
function lpSchedule(){
  const ctx = AudioEng.ctx; const {r, bpm, sound} = lpCurrent(); const spb = 60 / bpm;
  const horizon = ctx.currentTime + 0.15;
  // the metronome runs on its own absolute clock so it never skips or doubles at the loop point
  while (P.clickStart + P.clickT * spb < horizon){
    if (!lp.loop && P.clickT >= P.total) break;
    if (lp.click) AudioEng.click(P.clickStart + P.clickT * spb, P.clickT % P.bpb === 0 ? 'accent' : 'tick');
    P.clickT++;
  }
  while (true){
    if (P.idx >= P.events.length){
      if (!lp.loop){ P.endAt = P.start + P.total * spb; break; }
      P.start += P.total * spb; P.idx = 0; P.loopN++;
    }
    const e = P.events[P.idx]; const time = P.start + e.t * spb;
    if (time >= horizon) break;
    if (!e.rest) e.notes.forEach(n => AudioEng.note(time, n.s, n.f, sound, lpCapo(), e.dur * spb, n));
    P.queue.push({time, idx:P.idx});
    P.idx++;
  }
  if (!lp.loop && P.endAt && ctx.currentTime > P.endAt + 0.4) lpStop();
}
function lpDraw(){
  if (!lp.playing) return;
  const now = AudioEng.ctx.currentTime; let cur = null;
  while (P.queue.length && P.queue[0].time <= now) cur = P.queue.shift();
  if (cur){
    $$('#tabBox .col.on').forEach(g => g.classList.remove('on'));
    const g = $(`#tabBox .col[data-ev="${cur.idx}"]`);
    if (g){ g.classList.add('on'); const box = $('#tabBox'); const x = g.getBBox ? g.getBBox().x : 0; if (box && (x < box.scrollLeft + 40 || x > box.scrollLeft + box.clientWidth - 80)) box.scrollLeft = Math.max(0, x - 60); }
  }
  P.raf = requestAnimationFrame(lpDraw);
}
function lpStop(){
  if (!lp.playing) return;
  lp.playing = false; clearInterval(P.timer); cancelAnimationFrame(P.raf); P.queue = []; P.endAt = 0;
  syncLpBtn(); $$('#tabBox .col.on').forEach(g => g.classList.remove('on'));
}
function syncLpBtn(){ const b = $('#lpPlay'); if (!b) return; b.classList.toggle('stop', lp.playing); b.innerHTML = lp.playing ? stopIcon : playIcon; b.setAttribute('aria-label', lp.playing ? 'Stop' : 'Play'); }
function lpRetab(){
  const {r, text, bpm} = lpCurrent(); const parsed = parseRiff(text);
  const box = $('#tabBox'); if (box) box.innerHTML = tabSvg(parsed.events, -1, r, parsed.bars);
  const er = $('#riffErr'); if (er) er.innerHTML = parsed.errors.slice(0, 3).map(esc).join('<br>');
  const sv = $('#riffSave'); if (sv) sv.disabled = !lp.dirty;
  const v = $('#lpBpm'); if (v) v.textContent = bpm;
  const nm = $('#lpName'); if (nm) nm.textContent = tempoName(bpm);
  const pc = $('#lpPct'); if (pc) pc.textContent = Math.round(bpm / r.bpm * 100) + '% of ' + r.bpm;
  const ut = $('#lpTechs'); if (ut){ const used = riffTechs(text); ut.textContent = used.length ? 'Uses ' + used.map(t => TECHS[t].name.toLowerCase()).join(', ') : ''; }
  if (lp.playing){ P.events = parsed.events; P.total = parsed.total; if (P.idx > P.events.length) P.idx = P.events.length; }
}

/* =========================================================
   Events
   ========================================================= */
let tapTimes = [];
let noteTimer = 0, riffTimer = 0, cfTimer = 0;
function openRiff(id){ lpStop(); flStop(true); lp.key = null; lp.riffId = id; lp.text = null; lp.bpm = null; lp.dirty = false; ui.drawer = null; go('lead'); }
document.addEventListener('click', e => {

    case 'sw-stop': swStop(); break;
    case 'open-trainer': cs.mode = 'trainer'; cs.src = {type:'pair', pair: el.dataset.pair}; ui.drawer = null; go('changes'); break;
    case 'open-minute': cs.mode = 'minute'; om.pair = el.dataset.pair; om.phase = 'idle'; ui.drawer = null; go('changes'); break;
    case 'drill-song': { const s = songById(el.dataset.id); cs.mode = 'trainer'; cs.src = {type:'song', id: s.id}; cs.ts = s.ts === 3 ? 3 : 4; cs.bpm = Math.max(40, Math.round(s.bpm * 0.6)); ui.drawer = null; go('changes'); break; }
    case 'open-song': ui.drawer = {kind:'song', id: el.dataset.id}; renderDrawer(); break;
    case 'open-lead': ui.drawer = {kind:'lead', id: el.dataset.id}; renderDrawer(); break;
    case 'open-riff': openRiff(el.dataset.id); break;
    case 'close-drawer': ui.drawer = null; renderDrawer(); break;
    case 'status': {
      const id = el.dataset.id, v = el.dataset.v;
      const wasMv = currentMv().id;
      setSongState(id, {status: v, confirmedAt: v === 'done' ? Date.now() : null});
      if (v === 'done'){ const nowMv = currentMv(); toast(nowMv.id !== wasMv ? `${(songById(id) || leadById(id)).title} is done, and Movement ${MOVEMENTS.find(m => m.id === wasMv).num} is complete. Movement ${nowMv.num} starts now.` : `${(songById(id) || leadById(id)).title} is done. Nice work.`); }
      render(); break;
    }
    case 'hear': AudioEng.strum(el.dataset.chord); break;
    case 'learn-chord': { const c = el.dataset.chord; learnChord(c); toast(`${c} added to your chords. Next: change to it ${CHORD_TARGET}+ times a minute.`); render(); break; }
    case 'tech': { const t = el.dataset.t, on = el.dataset.v === '1'; const wasMv = currentMv().id; setTech(t, on); const nowMv = currentMv();
      toast(on ? (nowMv.id !== wasMv ? `${TECHS[t].name} learned. Movement ${nowMv.num} starts now.` : `${TECHS[t].name} learned. Riffs that use it join Side B.`) : `${TECHS[t].name} set back to not learned.`); render(); break; }
    case 'pickmv': ui.learnMv = el.dataset.mv; render(); break;
    case 'open-mv': ui.learnMv = el.dataset.mv; ui.drawer = null; go('learn'); break;
    case 'mv-start': { const m = MOVEMENTS.find(x => x.id === el.dataset.mv); store.data.learn.opened[m.id] = Date.now(); touch('learn'); toast(`Movement ${m.num} started. Its songs and drills are on your path now.`); render(); break; }
    case 'cmode': trStop(); omStop(true); cs.mode = el.dataset.v; refreshChanges(); break;
    case 'src': trStop(); cs.src = el.dataset.v === 'song' ? {type:'song', id: (cs.src.id || todayPlan().playNow.s.id)} : {type:'pair', pair: cs.src.pair || 'D-G'}; if (cs.src.type === 'song'){ const s = songById(cs.src.id); cs.ts = s.ts === 3 ? 3 : 4; cs.bpm = Math.max(40, Math.round(s.bpm * 0.6)); } refreshChanges(); break;
    case 'pickpair': { const was = cs.running; trStop(); cs.src = {type:'pair', pair: el.dataset.pair}; refreshChanges(); if (was) trStart(); break; }
    case 'beats': { const was = cs.running; trStop(); cs.beats = Number(el.dataset.v); refreshChanges(); if (was) trStart(); break; }
    case 'ts': { const was = cs.running; trStop(); cs.ts = Number(el.dataset.v); refreshChanges(); if (was) trStart(); break; }
    case 'trtoggle': cs.running ? trStop() : trStart(); break;
    case 'bpm': setBpm(cs.bpm + Number(el.dataset.d)); break;
    case 'tap': {
      const t = performance.now(); tapTimes = tapTimes.filter(x => t - x < 2500); tapTimes.push(t);
      if (tapTimes.length >= 3){ const gaps = tapTimes.slice(1).map((x, i) => x - tapTimes[i]); const avg = gaps.reduce((p, q) => p + q, 0) / gaps.length; setBpm(60000 / avg); }
      else toast('Keep tapping on the beat…');
      break;
    }
    case 'messy': setBpm(cs.bpm - 6); toast(`Slowed to ${cs.bpm} bpm.`); break;
    case 'clean': saveClean(); break;
    case 'ompair': if (om.phase === 'run' || om.phase === 'count') return; om.pair = el.dataset.pair; om.phase = 'idle'; refreshChanges(); break;
    case 'omtap': omTap(); break;
    case 'omcancel': omStop(false); break;
    case 'omundo': if (om.last){ removeLastDrill(om.last); om.last = null; om.phase = 'idle'; toast('Removed that test.'); refreshChanges(); } break;
    case 'omlog': { const inp = $('#manualCount'); const n = Number(inp.value); if (!inp.value || !(n >= 0) || n > 200){ toast('Enter a count between 0 and 200.'); return; } addDrill(om.pair, Math.round(n)); toast(`Saved ${Math.round(n)} for ${pairLabel(om.pair)}.`); refreshChanges(); break; }
    case 'lib': ui.lib[el.dataset.k] = el.dataset.v; render(); break;
    case 'libtab': ui.lib.tab = el.dataset.v; render(); break;
    case 'cf-capo': ui.cf.capo = Number(el.dataset.v); render(); break;
    case 'cf-example': ui.cf.text = el.dataset.v; ui.cf.title = el.dataset.t.replace(/ \(.*\)$/, ''); ui.cf.capo = null; render(); break;
    case 'cf-add': {
      const c = ui.cf; const title = ($('#cfTitle') || {}).value || c.title;
      if (!String(title).trim()){ toast('Give the song a title first.'); const t = $('#cfTitle'); if (t) t.focus(); return; }
      const seq = parseSheet(c.text).chords.map(ch => shapeFor(ch.root - c.capo, ch.q)).filter(Boolean).map(x => [x.name, Number(c.beats) || 4]);
      const bpm = clamp(Number(c.bpm) || 90, 30, 220);
      const id = 'my-' + Date.now().toString(36);
      store.data.mysongs.items.push({id, title:String(title).trim(), artist:String(c.artist || '').trim(), seq, bpm, capo:c.capo, ts:4, orig:c.text.trim()});
      touch('mysongs');
      ui.cf = {text:'', capo:null, title:'', artist:'', bpm:90, beats:4};
      toast(`Added to Side A as ${trackNo(id)}.`);
      ui.lib.tab = 'songs'; render(); ui.drawer = {kind:'song', id}; renderDrawer(); break;
    }
    case 'mysong-del': {
      if (el.dataset.armed !== '1'){ el.dataset.armed = '1'; el.textContent = 'Tap again to remove'; setTimeout(() => { if (el.isConnected){ el.dataset.armed = ''; el.textContent = 'Remove this song'; } }, 3000); return; }
      store.data.mysongs.items = store.data.mysongs.items.filter(s => s.id !== el.dataset.id); touch('mysongs'); ui.drawer = null; toast('Song removed.'); render(); break;
    }
    case 'pickriff': lpStop(); flStop(true); lp.key = null; if (lp.dirty && lp.riffId !== el.dataset.id) toast('Unsaved changes were discarded.'); lp.riffId = el.dataset.id; lp.text = null; lp.bpm = null; lp.dirty = false; render(); break;
    case 'lptoggle': lp.playing ? lpStop() : lpStart(); break;
    case 'lpbpm': { const {bpm} = lpCurrent(); lp.bpm = clamp(bpm + Number(el.dataset.d), 30, 260); lpRetab(); if (lp.playing){ lpStop(); lpStart(true); } break; }
    case 'lpsound': lp.sound = el.dataset.v; $$('[data-act="lpsound"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === lp.sound)); break;
    case 'riffsave': {
      const {r, text, bpm} = lpCurrent();
      const t = $('#riffTitle');
      store.data.riffs.map[lp.riffId] = r.custom ? {title: (t && t.value.trim()) || r.title, text, bpm, ts: r.ts || 4, custom:true} : {text, bpm};
      touch('riffs'); lp.dirty = false; lp.text = null; lp.bpm = null; toast('Riff saved.'); render(); break;
    }
    case 'riffreset': delete store.data.riffs.map[lp.riffId]; touch('riffs'); lp.text = null; lp.bpm = null; lp.dirty = false; toast('Back to the original.'); render(); break;
    case 'riffdel': {
      if (el.dataset.armed !== '1'){ el.dataset.armed = '1'; el.textContent = 'Tap again to delete'; setTimeout(() => { if (el.isConnected){ el.dataset.armed = ''; el.textContent = 'Delete riff'; } }, 3000); return; }
      lpStop(); delete store.data.riffs.map[lp.riffId]; touch('riffs'); lp.riffId = 'peter-gunn'; lp.text = null; lp.bpm = null; lp.dirty = false; toast('Riff deleted.'); render(); break;
    }
    case 'newriff': {
      lpStop(); const id = 'my-' + Date.now().toString(36);
      store.data.riffs.map[id] = {title:'New riff', text:'5/0:4 5/2 5/3 5/5', bpm:90, ts:4, custom:true};
      touch('riffs'); lp.riffId = id; lp.text = null; lp.bpm = null; lp.dirty = false; render();
      const ta = $('#riffTitle'); if (ta){ ta.focus(); ta.select(); }
      break;
    }
    case 'ppair': ui.progressPair = el.dataset.pair; render(); break;
    case 'defsound': saveSettings({sound: el.dataset.v}); render(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  switch (a){
    case 'countin': cs.countIn = el.checked; break;
    case 'strumtog': cs.strum = el.checked; { const w = $('#strumWrap'); if (w) w.hidden = !cs.strum; } break;
    case 'rampon': cs.ramp.on = el.checked; break;
    case 'ramp': { const v = Number(el.value); if (v > 0) cs.ramp[el.dataset.k] = v; break; }
    case 'songsel': { trStop(); const s = songById(el.value); cs.src = {type:'song', id: s.id}; cs.ts = s.ts === 3 ? 3 : 4; cs.bpm = Math.max(40, Math.round(s.bpm * 0.6)); refreshChanges(); break; }
    case 'libsel': ui.lib[el.dataset.k] = el.value; render(); break;
    case 'libplay': ui.lib.playable = el.checked; render(); break;
    case 'lpopt': lp[el.dataset.k] = el.checked; break;
    case 'riffsel': lpStop(); flStop(true); lp.key = null; lp.riffId = el.value; lp.text = null; lp.bpm = null; lp.dirty = false; render(); break;
    case 'cf': ui.cf[el.dataset.k] = el.value; break;
    case 'known': { const k = settings().known.filter(c => c !== el.dataset.v); if (el.checked) k.push(el.dataset.v); saveSettings({known: CHORD_LIST.filter(c => k.includes(c))}); render(); break; }
    case 'thr': { const lo = Number($('#thLo').value), hi = Number($('#thHi').value); if (lo > 0 && hi > lo){ saveSettings({lo, hi}); render(); } else toast('“Ready” has to be higher than “comfortable”.'); break; }
    case 'setname': saveSettings({name: el.value.trim().slice(0, 30)}); render(); break;
    case 'blk': { const b = settings().blocks.slice(); const v = Number(el.value); if (v >= 1 && v <= 60){ b[Number(el.dataset.i)] = Math.round(v); saveSettings({blocks: b}); renderRail(); } break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  if (a === 'bpmrange') setBpm(Number(el.value));
  else if (a === 'libq'){ ui.lib.q = el.value; clearTimeout(noteTimer); noteTimer = setTimeout(() => { const pos = el.selectionStart; render(); const q = $('#libQ'); if (q){ q.focus(); try{ q.setSelectionRange(pos, pos); }catch(_){} } }, 220); }
  else if (a === 'cftext'){ ui.cf.text = el.value; ui.cf.capo = null; clearTimeout(cfTimer); cfTimer = setTimeout(() => { const pos = el.selectionStart; render(); const t = $('#cfText'); if (t){ t.focus(); try{ t.setSelectionRange(pos, pos); }catch(_){} } }, 350); }
  else if (a === 'cf') ui.cf[el.dataset.k] = el.value;
  else if (a === 'note'){ const id = el.dataset.id; clearTimeout(noteTimer); noteTimer = setTimeout(() => setSongState(id, {note: el.value}), 500); }
  else if (a === 'rifftext'){ lp.text = el.value; lp.dirty = true; clearTimeout(riffTimer); riffTimer = setTimeout(lpRetab, 250); const sv = $('#riffSave'); if (sv) sv.disabled = false; }
  else if (a === 'rifftitle'){ lp.dirty = true; const sv = $('#riffSave'); if (sv) sv.disabled = false; if (lp.text === null) lp.text = lpCurrent().text; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.drawer){ ui.drawer = null; renderDrawer(); return; }
  if (e.code !== 'Space' && e.key !== ' ') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (ui.drawer) return;
  if (ui.view === 'changes'){
    e.preventDefault();
    if (cs.mode === 'minute') omTap(); else (cs.running ? trStop() : trStart());
  } else if (ui.view === 'lead'){
    e.preventDefault(); if (fl.on) return; lp.playing ? lpStop() : lpStart();
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.some(v => v.id === h) && h !== ui.view) go(h); });
// Playback keeps going when you switch tabs or windows (to a video, say); browsers don't slow down tabs that are playing sound.

/* =========================================================
   Boot
   ========================================================= */
loadLocal();
(function initView(){
  const h = (location.hash || '').slice(1);
  if (VIEWS.some(v => v.id === h)) ui.view = h;
  const p = todayPlan();
  cs.src = {type:'pair', pair: p.drillPair.k};
  om.pair = p.drillPair.k;
  if (p.lead && p.lead.riff) lp.riffId = p.lead.riff;
})();
render();
practiceInit();
connectDb();

</script>
